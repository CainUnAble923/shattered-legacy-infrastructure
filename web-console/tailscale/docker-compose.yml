# cc-P155: the web console's own tailnet node, uoconsole, on the game PC's Docker. Tailscale Serve gives
# https://uoconsole.tail81098d.ts.net/ Tailscale's certificate and proxies it to the web console's tailnet listener
# (127.0.0.1:8096 on the game PC, reached as host.docker.internal), adding the caller's Tailscale-User-Login, which
# the console checks (web-console/panels.py decide). Never Funnel (serve.json sets AllowFunnel false), never public:
# no ports are published, so nothing here listens on the LAN; userspace networking, so no NET_ADMIN and no tun device.
# Started by web-console/Install-WebConsole.ps1 -Tailscale, with the auth key Chase made in D:\UO\web-console\tailscale.env
# (TS_AUTHKEY=..., outside git, never logged). After the first login the node's state is in the uoconsole-ts-state
# volume and the key is not needed again. ASCII only.
# cc-P182: Serve now proxies to the proof forwarder (proof_proxy.py) on 127.0.0.2:8097 in this node's own network
# namespace, which adds X-UOConsole-Proof (the secret in D:\UO\web-console\proof.key, made by the installer, never
# logged) before passing each request on to 127.0.0.1:8096. The console refuses the tailnet listener without it, so a
# container on this PC's Docker that reaches 8096 directly cannot act as Chase (P155's Deviation 2).
# cc-P186: the remote Golems' agents (D:\UO\golem\Remote-Agent.ps1 on each extra PC, tagged tag:golem) come the same
# way: they call https://uoconsole.tail81098d.ts.net/api/agent/... over the tailnet, so Serve and the forwarder add the
# proof as for any request; the console then checks that Golem's own secret (no login: a tagged PC has none). Nothing
# is published and the extra PCs open no port. The tailnet ACL must let tag:golem reach tag:uoconsole on 443.
name: uoconsole
services:
  tailscale:
    image: tailscale/tailscale:v1.88.3
    container_name: uoconsole-ts
    hostname: uoconsole
    restart: unless-stopped
    env_file:
      - ${UOCONSOLE_ENV:-D:/UO/web-console/tailscale.env}
    environment:
      TS_HOSTNAME: uoconsole
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-tags=tag:uoconsole
      TS_ACCEPT_DNS: "false"
    volumes:
      - uoconsole-ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
  proof:
    image: python:3.12.7-alpine3.20
    container_name: uoconsole-proof
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    command: ["python", "-I", "/app/proof_proxy.py"]
    volumes:
      - ./proof_proxy.py:/app/proof_proxy.py:ro
      - ${UOCONSOLE_PROOF:-D:/UO/web-console/proof.key}:/run/uoconsole/proof.key:ro
volumes:
  uoconsole-ts-state:
