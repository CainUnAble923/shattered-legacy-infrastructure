# cc-P155: the web console's own tailnet node, uoconsole, on the game PC's Docker. Tailscale Serve gives
# https://uoconsole.tail81098d.ts.net/ Tailscale's certificate and proxies it to the web console's tailnet listener
# (127.0.0.1:8096 on the game PC, reached as host.docker.internal), adding the caller's Tailscale-User-Login, which
# the console checks (web-console/panels.py decide). Never Funnel (serve.json sets AllowFunnel false), never public:
# no ports are published, so nothing here listens on the LAN; userspace networking, so no NET_ADMIN and no tun device.
# Started by web-console/Install-WebConsole.ps1 -Tailscale, with the auth key Chase made in D:\UO\web-console\tailscale.env
# (TS_AUTHKEY=..., outside git, never logged). After the first login the node's state is in the uoconsole-ts-state
# volume and the key is not needed again. ASCII only.
name: uoconsole
services:
  tailscale:
    image: tailscale/tailscale:v1.88.3
    container_name: uoconsole-ts
    hostname: uoconsole
    restart: unless-stopped
    env_file:
      - ${UOCONSOLE_ENV:-D:/UO/web-console/tailscale.env}
    environment:
      TS_HOSTNAME: uoconsole
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-tags=tag:uoconsole
      TS_ACCEPT_DNS: "false"
    volumes:
      - uoconsole-ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
volumes:
  uoconsole-ts-state:
