; Shattered Legacy skin for the DokuWiki default template, Night theme.
; Values come from the Shattered Legacy design system (tokens.json).
; This file only overrides [replacements]; the template's own style.ini
; still supplies the stylesheet list.

[replacements]
__text__            = "#cfcabd"   ; text
__background__      = "#141414"   ; panel (the page area)
__text_alt__        = "#8a8578"   ; muted
__background_alt__  = "#1c1810"   ; code-bg (code, table headers, toc)
__text_neu__        = "#a19c90"   ; tier-1
__background_neu__  = "#221c10"   ; button-hover
__border__          = "#2a2317"   ; line
__highlight__       = "#3d3218"   ; search hit background
__link__            = "#e3c98d"   ; gold-bright
__background_site__ = "#0d0d0d"   ; bg
__existing__        = "#e3c98d"   ; gold-bright
__missing__         = "#e0674c"   ; vermilion (page does not exist yet)
__site_width__      = "75em"
__sidebar_width__   = "16em"
__tablet_width__    = "800px"
__phone_width__     = "480px"
__theme_color__     = "#0d0d0d"
