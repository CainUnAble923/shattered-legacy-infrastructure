services:
  wiki:
    image: ghcr.io/dokuwiki/dokuwiki:latest
    container_name: sl-wiki
    restart: unless-stopped
    # No public ports: access only through Nginx Proxy Manager
    expose:
      - "8080"
    # Everything DokuWiki keeps (pages, media, config, plugins, the skin) lives in /storage.
    # The image installs DokuWiki to /var/www/html; nothing else needs mounting.
    volumes:
      - storage:/storage
    environment:
      TZ: ${TZ:-America/Chicago}

networks:
  default:
    name: sl-wiki-net

volumes:
  storage:
    name: sl-wiki-storage
    external: true
