<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Skill and stat systems diagram</title>
  <desc id="desc">A diagram showing faster skill gain, expanded stat caps, trainers, and professions.</desc>
  <rect width="900" height="420" fill="#101820"/>
  <text x="450" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#f2cc8f">ClusterF Progression</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="115" width="210" height="108" rx="8" fill="#254441"/>
    <text x="175" y="158" font-size="22" fill="#ffffff">Skill Gain</text>
    <text x="175" y="190" font-size="15" fill="#cde8df">3 attempts</text>
    <text x="175" y="213" font-size="15" fill="#cde8df">5x amount</text>
    <rect x="345" y="115" width="210" height="108" rx="8" fill="#653239"/>
    <text x="450" y="158" font-size="22" fill="#ffffff">Stats</text>
    <text x="450" y="190" font-size="15" fill="#f7d7dd">500 each</text>
    <text x="450" y="213" font-size="15" fill="#f7d7dd">1500 total</text>
    <rect x="620" y="115" width="210" height="108" rx="8" fill="#33415c"/>
    <text x="725" y="158" font-size="22" fill="#ffffff">Trainers</text>
    <text x="725" y="190" font-size="15" fill="#d9e3f0">New Haven</text>
    <text x="725" y="213" font-size="15" fill="#d9e3f0">verified list</text>
    <rect x="208" y="280" width="210" height="82" rx="8" fill="#5f6f52"/>
    <text x="313" y="315" font-size="22" fill="#ffffff">Professions</text>
    <text x="313" y="344" font-size="15" fill="#eef4dc">mining, smithing, focus</text>
    <rect x="482" y="280" width="210" height="82" rx="8" fill="#7f4f24"/>
    <text x="587" y="315" font-size="22" fill="#ffffff">Guides</text>
    <text x="587" y="344" font-size="15" fill="#ffe8cc">first hour route</text>
  </g>
  <g stroke="#f2cc8f" stroke-width="3" fill="none" opacity="0.75">
    <path d="M175 223 C220 262 250 278 313 280"/>
    <path d="M450 223 C420 260 378 272 313 280"/>
    <path d="M725 223 C675 260 645 272 587 280"/>
    <path d="M450 223 C490 260 525 272 587 280"/>
  </g>
</svg>
