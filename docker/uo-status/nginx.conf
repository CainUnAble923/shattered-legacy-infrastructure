server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Marks every answer as coming from this container, so a 404 here can be told apart
    # from a 404 at the website. Check with: curl -I .../api/migration.json
    add_header X-SL-Status "uo-status" always;

    # Both paths work, with or without /api/, because NPM custom locations pass the prefix
    # through unless the forward target ends in a slash, and that is easy to get wrong.

    # The publisher rewrites status.json every 30s. Caching it would defeat the staleness
    # check that the whole liveness story rests on, so do not cache it anywhere.
    location ~ ^/(api/)?status\.json$ {
        add_header X-SL-Status "uo-status" always;
        add_header Cache-Control "no-store, max-age=0" always;
        default_type application/json;
        try_files /status.json =503;
    }

    # Written by scripts/Build-MigrationStatus.ps1 when the bug list changes, not on a timer,
    # so a short cache is fine. Counts only; see that script before adding anything.
    location ~ ^/(api/)?migration\.json$ {
        add_header X-SL-Status "uo-status" always;
        add_header Cache-Control "max-age=300" always;
        default_type application/json;
        try_files /migration.json =404;
    }

    # Written every 30s by the shard-probe container. Same no-cache rule as status.json.
    location ~ ^/(api/)?shards\.json$ {
        add_header X-SL-Status "uo-status" always;
        add_header Cache-Control "no-store, max-age=0" always;
        default_type application/json;
        try_files /shards.json =503;
    }

    # Nothing else is served. The folder holds these three files and it stays that way.
    location / {
        return 404;
    }
}
