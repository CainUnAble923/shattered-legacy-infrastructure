# Serves the shard's own status files to the proxy on Haven. Read-only, no Docker socket.
# The shard writes status.json, Build-MigrationStatus.ps1 writes migration.json, and the
# probe below writes shards.json. nginx only hands them out. See README.md for the contract.
services:
  uo-status:
    image: nginx:alpine
    container_name: sl-uo-status
    restart: unless-stopped
    ports:
      - "8092:80"
    volumes:
      - ${SERVER_PATH}/lib/uo/modernuo/status:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      TZ: ${TZ:-America/Chicago}

  # Up/down for the live (2593) and test (2594) shards. See probe.py for why a plain
  # connect is not enough behind Docker Desktop. Not published on any port.
  shard-probe:
    image: python:3-alpine
    container_name: sl-shard-probe
    restart: unless-stopped
    command: ["python", "-u", "/probe.py"]
    volumes:
      - ${SERVER_PATH}/lib/uo/modernuo/status:/status
      - ./probe.py:/probe.py:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-America/Chicago}

networks:
  default:
    name: sl-uo-status-net
