# Throwaway test shard. Separate container, separate port, SEPARATE SAVE.
#
# The live stack (docker-compose.yml) mounts the real world save. That is correct
# for the live shard and wrong for a spot check: a few hundred spawned test items
# would persist into the real world. This file exists so testing can never do that.
#
#   docker/uo/test-shard.sh          build (gated) + bring this up
#   docker compose -f docker/uo/docker-compose.test.yml down -t 60     stop it (60 s for the shutdown save, D50)
#
# Host port is 2594, so it can run alongside the live shard on 2593.
# There is no ddns-updater here on purpose: this must never touch public DNS.
#
# WHY THE TWO PORTS MATCH (2594 outside, 2594 inside). Do not "tidy" this back to
# 2594:2593. After login the server sends the client a relay packet (0x8C) carrying an
# address AND the port the server believes it listens on. Configuration-test sets that
# address to the LAN IP, 192.168.1.58. If the container listened on 2593, the relay would
# say 192.168.1.58:2593, which on this LAN is the LIVE shard: a test client would land on
# live without knowing (bug-list D8, back through the port instead of the address).
# Configuration-test's "listeners" is 0.0.0.0:2594 for the same reason, so the relay says
# 192.168.1.58:2594, which is this shard and nothing else, whatever the client does.
# Published on all interfaces so other machines in the house can test. The router
# forwards 2593 only; nothing outside the house can reach 2594.
# OWN COMPOSE PROJECT. Without this, both compose files sit in docker/uo/ and share the
# default project name "uo", so compose treats the LIVE sl-modernuo and sl-ddns as orphans
# of this stack: "docker compose -f docker-compose.test.yml down --remove-orphans" would
# stop the live shard. See bug-list D22.
name: sl-uo-test

services:
  modernuo-test:
    # cc-P96: Start-TestShard.ps1 -Image (the console's Roll back and Rebuild) runs another sl-modernuo tag
    # through SL_TEST_IMAGE without moving latest. Unset, it is latest, as before.
    image: ${SL_TEST_IMAGE:-sl-modernuo:latest}
    container_name: sl-modernuo-test
    restart: "no"
    stop_grace_period: 60s   # D50: was 1 s, which SIGKILLed D36's shutdown save mid-write
    ports:
      - "2594:2594"
      - "2594:2594/udp"
    volumes:
      - ${SERVER_PATH}/customizations:/modernuo-projects:ro
      - ${SERVER_PATH}/uo/modernuo/Configuration-test:/modernuo/Configuration
      # The test world's own folder (cc-P37): Saves, plus the Backups and Archives the shard writes
      # beside it, which used to vanish with the container. Mount the PARENT, never Saves alone:
      # the upgraded engine publishes a save by renaming Saves, which a bind mount cannot be
      # (cc-P30 run 2b). It was server/lib/uo/modernuo/Saves-test until P37.
      - ${SERVER_PATH}/lib/uo/modernuo-test:/var/lib/uo/modernuo
      # cc-P36 (Q-063): the test shard can run a different client-data folder from live, so the move to
      # 7.0.117.0 is tested before live follows. Unset, it falls back to live's folder as before.
      - ${CLIENT_DATA_PATH_TEST:-${CLIENT_DATA_PATH}}:/var/lib/uo/client-data/classic-client:ro
    environment:
      TZ: ${TZ:-America/Chicago}
      # cc-P73: one of the three locks on the test account wipe (server/customizations/Misc/TestAccountWipe.cs).
      # Only this file sets it; the live compose file never may.
      SL_SHARD_ROLE: test
    stdin_open: true
    tty: true
    # cc-P96: healthy only when the shard listens on its game port. Read from the kernel's socket table, not
    # by connecting (a probe connection every 10 s would be a login attempt in the log). 0A22 is 2594 and
    # 0A is LISTEN. A shard that threw at start sits at "press return to exit" (Main.cs:433) and never
    # listens, so it goes unhealthy once the start period ends, though Docker still says Up.
    healthcheck:
      test: ["CMD-SHELL", "awk '$$4==\"0A\" && $$2 ~ /:0A22$$/ {f=1} END {exit !f}' /proc/net/tcp /proc/net/tcp6"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    security_opt:
      - seccomp:unconfined
