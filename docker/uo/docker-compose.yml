# docker/uo's compose project "uo": since 2026-10-14 (cc-P108) only sl-ddns, the public DNS updater.
# The live shard's service (sl-modernuo) was retired that day and moved, not runnable, to
# retired/docker-compose.live.yml. Live returns only as a fresh 1.0 world, built new then.
# The test shard is docker-compose.test.yml (project sl-uo-test), started by Start-TestShard.ps1.
#
# cc-P668: sl-ddns publishes HAVEN's address, never this PC's. On 2026-10-26 it asked public "what is my IP"
# services from this PC, which goes out through Chase's VPN, and published the VPN's exit (159.26.100.174) as
# shatteredlegacyuo.com; the site went dark. Now its only public-IP source is sl-ddns-gate (ddns-gate/gate.py),
# which answers with Haven's address (sl-homeip, docker/homeip) and refuses (403 with no address in it, record left alone, loud log) when
# Haven does not answer or reports a known or learned VPN exit. Test-DdnsSafe.ps1 checks a running sl-ddns is this
# one, and stops one that is not; Start-TestShard.ps1 runs it on every start and stop.
# The names are variables only for the proof (scripts/tests/ddns/), which runs this same file as its own project
# with a dummy token and a test domain. Unset, they are the live ones.
services:
  ddns-gate:
    image: python:3-alpine
    container_name: ${GATE_NAME:-sl-ddns-gate}
    restart: unless-stopped
    init: true
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    volumes:
      - ./ddns-gate/gate.py:/app/gate.py:ro
      - ./ddns-gate/entrypoint.sh:/app/entrypoint.sh:ro
      - ddns_tls:/tls
      - ddns_gate:/data
    environment:
      # Haven's sl-homeip: its LAN address first, then its tailnet name (two ways to Haven with the VPN on or off).
      HAVEN_URLS: ${GATE_HAVEN_URLS:-http://192.168.1.61:8098/ip,http://haven.tail81098d.ts.net:8098/ip}
      # This PC's own egress, only to learn VPN exits; never published.
      EGRESS_URLS: ${GATE_EGRESS_URLS:-https://api.ipify.org,https://ipv4.icanhazip.com}
      BLOCK: ${GATE_BLOCK:-146.70.217.106/32,159.26.100.174/32}
      LEARN_AFTER: ${GATE_LEARN_AFTER:-900}
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8443/health', timeout=3, context=ssl._create_unverified_context())"]
      interval: 10s
      timeout: 5s
      retries: 30

  ddns-updater:
    image: qmcgaw/ddns-updater:latest
    container_name: ${DDNS_NAME:-sl-ddns}
    restart: unless-stopped
    depends_on:
      ddns-gate:
        condition: service_healthy
    volumes:
      - ddns_data:/updater/data
      - ddns_tls:/tls:ro
    environment:
      CONFIG: |
        {
          "settings": [
            {
              "provider": "cloudflare",
              "zone_identifier": "${CF_ZONE_ID}",
              "domain": "${DOMAIN}",
              "host": "@",
              "ttl": 120,
              "token": "${CF_API_TOKEN}",
              "ip_version": "ipv4"
            }
          ]
        }
      PERIOD: 5m
      UPDATE_COOLDOWN_PERIOD: 5m
      # cc-P668: the gate is the ONLY source. Never "all": that asked from this PC, through its VPN.
      # Test-DdnsSafe.ps1 refuses any other value of these four.
      PUBLICIP_FETCHERS: http
      PUBLICIP_HTTP_PROVIDERS: url:https://ddns-gate:8443/ip
      PUBLICIPV4_HTTP_PROVIDERS: url:https://ddns-gate:8443/ip
      PUBLICIPV6_HTTP_PROVIDERS: url:https://ddns-gate:8443/ip
      # The gate's certificate is self-signed; this bundle is the public CAs plus it (ddns-gate/entrypoint.sh).
      SSL_CERT_FILE: /tls/bundle.pem
      # Look our own records up on public DNS. The home router answers with the LAN address
      # (split DNS), which made the health check fail and the record rewrite every period (bug D23).
      RESOLVER_ADDRESS: "1.1.1.1:53"
      LOG_LEVEL: info

volumes:
  ddns_data:
  ddns_tls:
  ddns_gate:
