# Play-test queue (cc-P83). Runs on the WINDOWS BOX, LAN only: http://192.168.1.58:8093/
# Replaces sl-test-queue (the read-only nginx view of docs/client-test-queue.md). Chase marks each waiting
# play-test Pass, Fail or Later from any browser on the home network; results go to
# D:\UO\shard-migration\testing\play-tests.json (and SUMMARY.md beside it) for the overseer to read.
# server.py imports every prompt whose notes end "Pnn DONE" on start and every 60 s, using
# shard-migration/tools/playtests.py, the same file tools/Import-PlayTests.ps1 runs.
# NEVER route this through NPM on Haven. It is an internal checklist (GM commands, bug numbers), and it
# has no login: anyone who can reach the port can mark results. So it is published on this PC's LAN
# address and on localhost only, not on every interface.
services:
  play-tests:
    image: python:3-alpine
    container_name: sl-play-tests
    restart: unless-stopped
    command: ["python", "-u", "/app/svc/server.py"]
    ports:
      - "192.168.1.58:8093:8000"
      - "127.0.0.1:8093:8000"
    volumes:
      # Folders, not single files: a single-file bind mount goes stale when an editor replaces the file.
      - .:/app/svc:ro
      - D:/UO/shard-migration/tools:/app/tools:ro
      - D:/UO/shard-migration/notes:/data/notes:ro
      - D:/UO/shard-migration/docs:/data/docs:ro
      - D:/UO/shard-migration/testing:/data/testing
    environment:
      TZ: ${TZ:-America/Chicago}
      PLAYTESTS_ROOT: /data
      PLAYTESTS_LIB: /app/tools
      PLAYTESTS_HTML: /app/svc/html
      PLAYTESTS_PORT: "8000"
      IMPORT_SECONDS: "60"
      PYTHONDONTWRITEBYTECODE: "1"

networks:
  default:
    name: sl-test-queue-net
