# Client test queue viewer. Runs on the WINDOWS BOX, LAN only: http://192.168.1.58:8093/
# Renders D:\UO\shard-migration\docs\client-test-queue.md live; the page re-reads the file every
# 10 seconds, so edits (by Chase or any chat) show up without a rebuild. The file stays the only
# source of truth: this page never writes to it.
# NEVER route this through NPM on Haven. It is an internal checklist (GM commands, bug numbers).
services:
  test-queue:
    image: nginx:alpine
    container_name: sl-test-queue
    restart: unless-stopped
    ports:
      - "8093:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      # The whole docs folder, read-only: a single-file bind mount goes stale when an editor
      # saves by replacing the file. nginx.conf serves exactly one file out of it.
      - D:/UO/shard-migration/docs:/docs:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      TZ: ${TZ:-America/Chicago}

networks:
  default:
    name: sl-test-queue-net
