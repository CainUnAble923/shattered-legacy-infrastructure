<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Play tests</title>
<style>
:root {
  --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #66665f; --line: #deded8;
  --pass: #1d7a3a; --pass-bg: #e3f4e8; --fail: #a32020; --fail-bg: #fbe5e5;
  --later: #8a5a00; --later-bg: #fff1d6; --accent: #24508a; --chip: #ececE6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --card: #20201e; --text: #ecece6; --muted: #a3a39a; --line: #34342f;
    --pass: #7fd197; --pass-bg: #183323; --fail: #f19a9a; --fail-bg: #3a1c1c;
    --later: #f0c46c; --later-bg: #382c12; --accent: #8fb4ea; --chip: #2c2c29;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px 10px; }
.top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; }
.top a { color: var(--accent); font-weight: 600; text-decoration: none; padding: 6px 0; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.count { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-weight: 600; }
.count.fail { color: var(--fail); } .count.pass { color: var(--pass); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button, .item button, form button {
  min-height: 44px; min-width: 64px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font: inherit; font-weight: 600; cursor: pointer;
}
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
main { max-width: 900px; margin: 0 auto; padding: 8px 16px 64px; }
h2 { font-size: 17px; margin: 22px 0 8px; }
h2 small { color: var(--muted); font-weight: 400; }
.item { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; overflow-wrap: anywhere; }
.item.pass { border-left-color: var(--pass); } .item.fail { border-left-color: var(--fail); } .item.later { border-left-color: var(--later); }
.meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.chip { background: var(--chip); border-radius: 6px; padding: 1px 7px; }
.chip.warn { background: var(--later-bg); color: var(--later); }
.chip.st-pass { background: var(--pass-bg); color: var(--pass); } .chip.st-fail { background: var(--fail-bg); color: var(--fail); }
.chip.st-later { background: var(--later-bg); color: var(--later); }
/* cc-P112: the overnight bot's robot. Full: tonight's run tries it; dim: the bot can check it, no work tonight. */
.robot { font-size: 15px; line-height: 1; cursor: help; } .robot.dim { opacity: .38; filter: grayscale(1); }
.chip.bot { text-decoration: none; color: var(--text); } .chip.bot-PASS { background: var(--pass-bg); color: var(--pass); }
.chip.bot-FAIL { background: var(--fail-bg); color: var(--fail); } .chip.bot-FLAKY, .chip.bot-ERROR { background: var(--later-bg); color: var(--later); }
.count.quiet { font-weight: 400; color: var(--muted); border-style: dashed; }
/* cc-P115: who tests it. The badge is the standing answer; the robot (above) is tonight's plan. */
.who { border-radius: 6px; padding: 1px 7px; font-weight: 700; cursor: help; border: 1px solid transparent; }
.who-you { background: var(--accent); color: var(--bg); } .who-decide { background: var(--later-bg); color: var(--later); border-color: var(--later); }
.who-botyou { background: var(--card); color: var(--accent); border-color: var(--accent); }
.who-bot { background: var(--chip); color: var(--muted); } .who-cc { background: var(--chip); color: var(--text); border-color: var(--line); }
.who-unsorted { background: transparent; color: var(--muted); border: 1px dashed var(--line); font-weight: 400; }
.count.who-count { cursor: pointer; font-weight: 600; }
details.steps { margin-top: 6px; } details.steps summary { cursor: pointer; color: var(--accent); font-weight: 600; min-height: 32px; }
details.steps ol { margin: 4px 0; padding-left: 22px; } .steps .step b { color: var(--muted); font-weight: 600; }
.label { font-weight: 700; }
.expect { margin-top: 4px; } .expect b { color: var(--muted); font-weight: 600; }
.note { margin-top: 6px; padding: 6px 8px; border-radius: 6px; background: var(--fail-bg); color: var(--fail); }
.note.ok { background: var(--chip); color: var(--text); }
.prev { margin-top: 6px; font-size: 13px; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
button.pass { color: var(--pass); } button.fail { color: var(--fail); } button.later { color: var(--later); }
code { font: 14px ui-monospace, Consolas, monospace; background: var(--chip); border-radius: 4px; padding: 0 3px; }
form { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 12px 0; }
form input { width: 100%; min-height: 44px; margin: 4px 0 8px; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
.empty, .err { color: var(--muted); padding: 24px 0; }
.err { color: var(--fail); }
footer { color: var(--muted); font-size: 13px; margin-top: 24px; }
/* cc-P90: the Ideas tab */
.count.ideas { color: var(--accent); cursor: pointer; }
.badge { display: inline-block; min-width: 1.4em; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--bg); font-size: 13px; }
.badge[hidden] { display: none; } /* cc-P97: display above beat the hidden attribute, so a zero showed as "0" */
.filters button[aria-pressed="true"] .badge { background: var(--bg); color: var(--accent); }
form textarea, form select { width: 100%; min-height: 44px; margin: 4px 0 8px; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
form textarea { min-height: 88px; resize: vertical; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; } .row2 > div { flex: 1 1 220px; }
.hint { font-size: 14px; color: var(--later); background: var(--later-bg); border-radius: 6px; padding: 6px 8px; margin: 0 0 8px; }
.hint:empty { display: none; }
.idea { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--accent); border-radius: 8px; padding: 10px 12px; margin: 8px 0; overflow-wrap: anywhere; }
.idea.taken { border-left-color: var(--later); } .idea.became { border-left-color: var(--pass); } .idea.declined { border-left-color: var(--muted); opacity: .85; }
.idea .desc { white-space: pre-wrap; margin-top: 4px; }
.copybar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
#copy-out { width: 100%; min-height: 120px; font: 13px ui-monospace, Consolas, monospace; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.fq { margin: 2px 0; padding: 6px 8px; border-radius: 6px; } .fq:target { background: var(--later-bg); }
.fq b { font-weight: 700; } .fq small { color: var(--muted); }
/* cc-P97: the Bugs tab */
.count.bugs { color: var(--fail); cursor: pointer; }
.bug { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--fail); border-radius: 8px; padding: 10px 12px; margin: 8px 0; overflow-wrap: anywhere; }
.bug.taken { border-left-color: var(--later); } .bug.fixed { border-left-color: var(--pass); } .bug.duplicate, .bug.notbug { border-left-color: var(--muted); opacity: .85; }
.bug .desc { white-space: pre-wrap; margin-top: 2px; } .bug .desc b { color: var(--muted); font-weight: 600; }
.shots { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
.shots img { width: 96px; height: 96px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; }
.shots .pending { position: relative; } .shots .pending button { position: absolute; top: 2px; right: 2px; min-height: 32px; min-width: 32px; padding: 2px 8px; }
.paste { border: 2px dashed var(--line); border-radius: 8px; padding: 10px; margin: 4px 0 8px; color: var(--muted); font-size: 14px; }
.ver { font-size: 14px; color: var(--muted); margin: 0 0 8px; }
#bug-copy-out { width: 100%; min-height: 120px; font: 13px ui-monospace, Consolas, monospace; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
#bugs button { min-height: 44px; min-width: 64px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
#bugs input[type=file] { min-height: 44px; }
/* cc-P146: decisions as cards, and the Where chips */
.item.decision { border-left-color: var(--later); } .item.decision.answered { border-left-color: var(--accent); }
.item.decision.taken, .item.decision.elsewhere, .item.decision.moot, .item.decision.noted { border-left-color: var(--line); }
.item .opts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.item .opts button { text-align: left; }
.item button.chosen { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.item textarea { width: 100%; min-height: 64px; margin-top: 8px; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; resize: vertical; }
.answer { margin-top: 6px; padding: 6px 8px; border-radius: 6px; background: var(--pass-bg); color: var(--pass); white-space: pre-wrap; }
.answer.other { background: var(--chip); color: var(--text); }
.facts { margin-top: 4px; font-size: 14px; } .facts b { color: var(--muted); font-weight: 600; }
.wherebar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.wherebar[hidden] { display: none; }
.wherebar button { min-height: 40px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 15px; cursor: pointer; }
.wherebar button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.wherebar button.sub { font-size: 14px; min-height: 36px; border-style: dashed; }
.wherebar .n { opacity: .75; font-weight: 600; margin-left: 4px; }
.count.answers { color: var(--accent); cursor: pointer; }
#ideas button { min-height: 44px; min-width: 64px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
/* cc-P164: Up next, the sessions. Phone first: one column, big tap targets, no tables. */
body.nextview .filters button:not([data-f="next"]):not([data-f="items"]) { display: none; }
.filters button[data-f="items"] { display: none; }
body.nextview .filters button[data-f="items"] { display: inline-block; }
body.nextview #counts, body.nextview #where-chips, body.nextview #add { display: none; }
.sess { margin: 4px 0 16px; }
.sess h2 { font-size: 22px; margin: 4px 0; }
.sess .why { color: var(--muted); margin: 0 0 8px; }
.sess .progress { font-weight: 700; margin: 0 0 10px; font-size: 17px; }
.before { background: var(--later-bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 0 0 14px; }
.before b { display: block; margin-bottom: 4px; }
.before ul { margin: 0; padding-left: 20px; } .before li { margin: 4px 0; }
.snav { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin: 6px 0 12px; }
.snav span { color: var(--muted); font-size: 15px; text-align: center; flex: 1; }
.snav button, .scard button, .sgo, .sall { min-height: 52px; min-width: 64px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; }
.scard { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--line); border-radius: 12px; padding: 14px; margin: 0 0 12px; font-size: 17px; }
.scard.todo { border-left-color: var(--accent); }
.scard.done { padding: 8px 14px; opacity: .8; font-size: 15px; }
.scard .sline { font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.scard .spass { margin-top: 6px; line-height: 1.4; overflow-wrap: anywhere; } .scard .spass b { color: var(--pass); }
.scard .splace, .scard .sreason { margin-top: 6px; color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }
.scard .tag { display: inline-block; margin: 6px 6px 0 0; padding: 2px 8px; border-radius: 999px; background: var(--later-bg); color: var(--later); font-size: 14px; font-weight: 600; }
.scard .sact { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.scard .sact button { flex: 1 1 30%; }
.scard button.pass { background: var(--pass-bg); color: var(--pass); border-color: var(--pass); }
.scard button.fail { background: var(--fail-bg); color: var(--fail); border-color: var(--fail); }
.scard button.later { background: var(--later-bg); color: var(--later); border-color: var(--later); }
.scard .sfail { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.scard .sfail[hidden] { display: none; }
.scard .sfail input { flex: 1 1 100%; min-height: 48px; font: inherit; font-size: 17px; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
.scard .sid { margin-top: 8px; color: var(--muted); font-size: 12px; }
.scard .sst { font-weight: 700; margin-right: 8px; } .scard .sst.pass { color: var(--pass); } .scard .sst.fail { color: var(--fail); } .scard .sst.later { color: var(--later); }
.owed { color: var(--muted); margin: 12px 0; font-size: 15px; }
.slist { list-style: none; padding: 0; margin: 8px 0 24px; }
.slist li { margin: 0 0 8px; }
.sgo { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 8px; }
.sgo .n { color: var(--muted); white-space: nowrap; }
.sgo.cur { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.sgo.fin { min-height: 40px; font-weight: 400; font-size: 15px; color: var(--muted); }
.sall { width: 100%; margin: 0 0 12px; }
</style>
</head>
<body>
<!-- cc-P88: the shared menu (Play tests, Shard status, Dashboard). Until sl-play-tests is restarted with the
     /nav.js route, the old service answers 404 and the page says so in one line instead. -->
<script src="/nav.js" data-sl-page="playtests" onerror="this.insertAdjacentHTML('afterend', '<p style=&quot;margin:0;padding:8px 16px;font:14px system-ui,sans-serif&quot;>Menu not loaded: restart sl-play-tests with Start-TestQueue.ps1. <a href=&quot;/status&quot;>Shard status</a></p>')"></script>
<header>
  <div class="top">
    <h1>Play tests</h1>
    <a href="#add">Add an item</a>
  </div>
  <div class="counts" id="counts"></div>
  <div class="filters" role="group" aria-label="Show">
    <!-- cc-P164: the page opens on Up next (a short session); All items is the full list below, unchanged. -->
    <button data-f="next" aria-pressed="true" title="What to test now, in a short session">Up next</button>
    <button data-f="items" aria-pressed="false" title="The full list and its filters">All items</button>
    <button data-f="open" aria-pressed="false">Open</button>
    <button data-f="fail" aria-pressed="false">Failed</button>
    <button data-f="all" aria-pressed="false">All</button>
    <button data-f="bot" aria-pressed="false" title="Only the items the overnight bot tries tonight">Bot tonight</button>
    <button data-f="mine" aria-pressed="false" title="Open items that need you: You, Bot then you, and You decide">Mine</button>
    <button data-f="whobot" aria-pressed="false" title="Open items the overnight bot settles on its own">Bot</button>
    <button data-f="cc" aria-pressed="false" title="Open items Claude Code can settle from files, logs or tests">CC</button>
    <button data-f="answered" aria-pressed="false" title="Decisions you answered here that the overseer has not taken into a prompt yet">Answered, not yet taken</button>
    <button data-f="ideas" aria-pressed="false">Ideas <span class="badge" id="ideas-n" hidden></span></button>
    <button data-f="bugs" aria-pressed="false">Bugs <span class="badge" id="bugs-n" hidden></span></button>
  </div>
  <!-- cc-P146: where each item is done; combines with the buttons above (Mine + In game: Player, say). -->
  <div class="wherebar" id="where-chips" role="group" aria-label="Where"></div>
</header>
<main>
  <div id="list"><p class="empty">Loading...</p></div>
  <form id="add" autocomplete="off">
    <h2>Add an item by hand</h2>
    <label for="what">What to do</label><input id="what" maxlength="500" required>
    <label for="expect">What should happen</label><input id="expect" maxlength="500">
    <button type="submit">Add</button>
  </form>
  <!-- cc-P90: the feature-ideas inbox. The features chat turns ideas into F-NN entries; this page never edits docs/. -->
  <section id="ideas" hidden>
    <form id="idea-form" autocomplete="off">
      <h2>New idea</h2>
      <label for="i-title">Idea (a short title)</label><input id="i-title" maxlength="140" required>
      <div class="hint" id="i-hint" aria-live="polite"></div>
      <div class="row2">
        <div><label for="i-area">Area</label><select id="i-area"><option value="">(none)</option></select></div>
        <div><label for="i-pt">From play test (optional)</label><input id="i-pt" maxlength="12" placeholder="P71-3"></div>
      </div>
      <label for="i-desc">Details (optional)</label><textarea id="i-desc" maxlength="2000"></textarea>
      <button type="submit">Add idea</button>
    </form>
    <div class="copybar">
      <button type="button" id="copy-new">Copy new ideas</button>
      <span id="copy-msg"></span>
    </div>
    <textarea id="copy-out" readonly hidden aria-label="New ideas as text"></textarea>
    <div id="idea-list"></div>
    <h2>Already in the feature queue <small>(docs/feature-queue.md, read only)</small></h2>
    <input id="fq-filter" placeholder="Filter by words or F-number" aria-label="Filter the feature queue">
    <div id="fq"></div>
  </section>
  <!-- cc-P97: the bug-reports inbox. The overseer gives the real ones D-numbers in docs/bug-list.md; this page never
       edits docs/. -->
  <section id="bugs" hidden>
    <form id="bug-form" autocomplete="off">
      <h2>Report a bug</h2>
      <label for="b-title">Bug (a short title)</label><input id="b-title" maxlength="140" required>
      <label for="b-happened">What happened</label><textarea id="b-happened" maxlength="2000"></textarea>
      <label for="b-expected">What you expected</label><textarea id="b-expected" maxlength="2000"></textarea>
      <label for="b-steps">Steps (optional)</label><textarea id="b-steps" maxlength="2000" placeholder="1. ...&#10;2. ..."></textarea>
      <div class="row2">
        <div><label for="b-sev">Severity</label><select id="b-sev"><option value="">(none)</option></select></div>
        <div><label for="b-area">Area</label><select id="b-area"><option value="">(none)</option></select></div>
      </div>
      <div class="row2">
        <div><label for="b-pt">From play test (optional)</label><input id="b-pt" maxlength="12" placeholder="P71-3"></div>
        <div><label for="b-char">Character (optional)</label><input id="b-char" maxlength="140"></div>
        <div><label for="b-loc">Location (optional)</label><input id="b-loc" maxlength="140" placeholder="Minoc forge, 2510 560"></div>
      </div>
      <label for="b-shots">Screenshots (up to 3, PNG or JPG)</label>
      <input id="b-shots" type="file" accept="image/png,image/jpeg,image/*" multiple>
      <div class="paste" id="b-paste" tabindex="0">Or paste a screenshot here (Ctrl+V, or long-press and Paste on a phone).</div>
      <div class="shots" id="b-pending"></div>
      <p class="ver" id="b-ver"></p>
      <button type="submit">Add bug</button>
    </form>
    <div class="copybar">
      <button type="button" id="copy-bugs">Copy new bugs</button>
      <span id="bug-copy-msg"></span>
    </div>
    <textarea id="bug-copy-out" readonly hidden aria-label="New bug reports as text"></textarea>
    <div id="bug-list"></div>
  </section>
  <footer id="foot"></footer>
</main>
<script>
// cc-P83. Items come from server.py, which imports every prompt whose notes end "Pnn DONE".
// cc-P88: the links to the other pages are the shared menu (nav.js), not this page's own.
// cc-P164: the page always opens on Up next; the full list's last filter is remembered for All items.
var filter = 'next';
var listFilter = 'open';
try { listFilter = localStorage.getItem('pt-filter') || 'open'; } catch (e) {}
if (listFilter === 'next' || listFilter === 'items') listFilter = 'open';
var curSession = '', openDone = {};
var data = null;
var bot = null;  // cc-P112: GET /api/bot-tonight
var OPEN = { open: 1, later: 1, blocked: 1 };
// cc-P146: the Where chip ('' is any place) and the Player sub-chip ('' is every Player item).
var where = '', chr = '';
try { where = localStorage.getItem('pt-where') || ''; chr = localStorage.getItem('pt-char') || ''; } catch (e) {}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
// Notes use markdown backticks and bold; show them as such, after escaping.
function md(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); }

function group(it) {
  if (it.kind === 'decision' && !/^P\d+$/.test(it.prompt)) return 'Older queue (docs/client-test-queue.md)';
  if (it.prompt) return it.prompt;
  if (it.source === 'manual') return 'Added by hand';
  return 'Older queue (docs/client-test-queue.md)';
}
function groupRank(g) {
  var m = /^P(\d+)$/.exec(g);
  if (m) return 100000 - parseInt(m[1], 10);
  return g === 'Added by hand' ? 0 : 200000;
}
// cc-P115: who tests it, from the service (testing/bot-triage.md through tools/playwho.py).
var MINE = { you: 1, botyou: 1, decide: 1 };
function whoKey(it) { return (it.who && it.who.key) || ''; }
// cc-P146: the filter buttons, for an item or a decision (tools/playwhere.py primary() is the same rule), then the
// Where chip and the Player sub-chip on top.
var DEC_OPEN = { open: 1, later: 1, answered: 1 }, DEC_ASK = { open: 1, later: 1 };
function shown(it) { return shownPrimary(it) && whereMatch(it, where, chr); }
function whereMatch(it, w, c) {
  if (!w) return true;
  var x = it.where || {};
  if (x.key !== w) return false;
  if (w !== 'player' || !c) return true;
  var cs = x.chars || [];
  return c === 'any' ? !cs.length : cs.indexOf(c) >= 0;
}
function shownPrimary(it) {
  if (it.replacedBy && filter !== 'all') return false;
  if (it.kind === 'decision') {
    if (filter === 'open') return !!DEC_OPEN[it.state];
    if (filter === 'mine') return !!DEC_ASK[it.state];
    if (filter === 'answered') return it.state === 'answered';
    return filter === 'all';
  }
  if (filter === 'answered') return false;
  if (filter === 'bot') return botInfo(it.id).state === 'tonight';
  if (filter === 'mine') return !!OPEN[it.status] && !!MINE[whoKey(it)];
  if (filter === 'whobot') return !!OPEN[it.status] && whoKey(it) === 'bot';
  if (filter === 'cc') return !!OPEN[it.status] && whoKey(it) === 'cc';
  if (filter === 'open') return !!OPEN[it.status];
  if (filter === 'fail') return it.status === 'fail';
  return true;
}

function render() {
  var ideasView = filter === 'ideas', bugsView = filter === 'bugs';
  document.body.classList.toggle('nextview', filter === 'next');
  document.getElementById('ideas').hidden = !ideasView;
  document.getElementById('bugs').hidden = !bugsView;
  document.getElementById('list').hidden = ideasView || bugsView;
  document.getElementById('where-chips').hidden = ideasView || bugsView;
  document.getElementById('add').hidden = ideasView || bugsView;
  Array.prototype.forEach.call(document.querySelectorAll('.filters button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-f') === filter ? 'true' : 'false'); });
  renderIdeaCount();
  if (ideasView) renderIdeas();
  if (bugsView) renderBugs();
  if (!data) return;  // a filter clicked before the first load: load() renders when it arrives
  if (filter === 'next') { renderNext(); return; }
  var s = data.summary;
  document.getElementById('counts').innerHTML =
    // cc-P146: the open count leaves out the items now asked as decisions (they show as questions).
    '<span class="count">' + (s.open - (s.replaced || 0)) + ' open</span>' +
    '<span class="count fail">' + s.failed + ' failed' + (s.unloggedFails ? ' (' + s.unloggedFails + ' not logged)' : '') + '</span>' +
    '<span class="count pass">' + s.passed + ' passed</span>' +
    (s.later ? '<span class="count">' + s.later + ' later</span>' : '') +
    (ideas && ideas.summary.new ? '<span class="count ideas" data-go="ideas">' + ideas.summary.new + ' new idea' + (ideas.summary.new === 1 ? '' : 's') + '</span>' : '') +
    (bugsDoc && bugsDoc.summary.new ? '<span class="count bugs" data-go="bugs">' + bugsDoc.summary.new + ' new bug' + (bugsDoc.summary.new === 1 ? '' : 's') + '</span>' : '') +
    botCount();
  document.getElementById('counts').insertAdjacentHTML('beforeend', whoCounts());
  // cc-P146: answers given here that the overseer has not taken yet.
  var na = data.answers && data.answers.new;
  if (na) document.getElementById('counts').insertAdjacentHTML('beforeend', '<span class="count answers" data-go="answered" title="Answered here, not yet taken into a prompt by the overseer">' + na + ' new answer' + (na === 1 ? '' : 's') + '</span>');
  renderWhere();
  Array.prototype.forEach.call(document.querySelectorAll('.filters button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-f') === filter ? 'true' : 'false'); });
  var groups = {};
  allItems().forEach(function (it) { if (shown(it)) { (groups[group(it)] = groups[group(it)] || []).push(it); } });
  var names = Object.keys(groups).sort(function (a, b) { return groupRank(a) - groupRank(b); });
  var out = [];
  names.forEach(function (g) {
    var p = data.prompts[g];
    var title = p && p.title ? ' <small>' + esc(p.title.replace(/^cc-P\S*:?\s*/, '')) + '</small>' : '';
    out.push('<h2>' + esc(g) + title + '</h2>');
    groups[g].forEach(function (it) { out.push(it.kind === 'decision' ? decisionCard(it) : card(it)); });
  });
  if (filter === 'answered' && out.length) out.unshift('<div class="copybar"><button type="button" id="copy-answers">Copy new answers</button><span id="answers-msg"></span></div><textarea id="answers-out" readonly hidden aria-label="New answers as text"></textarea>');
  document.getElementById('list').innerHTML = out.length ? out.join('') : '<p class="empty">Nothing here.' + (filter === 'open' ? ' Every item has a result.' : '') + '</p>';
  var svc = data.service || {};
  document.getElementById('foot').textContent = 'Data: testing/play-tests.json in shard-migration. Last import ' + (svc.lastImport || 'not yet') +
    (svc.lastImportError ? ', FAILED: ' + svc.lastImportError : '') + '. A prompt that says DONE appears within a minute.' +
    // cc-P105: on Haven, how fresh the notes are and whether the game PC is reporting. Empty on the game PC: no change.
    (svc.repo && svc.repo.at ? ' Repo as of ' + svc.repo.at.replace('T', ' ').slice(0, 16) + (svc.repo.commit ? ' (' + svc.repo.commit.slice(0, 7) + ')' : '') + '.' : '') +
    (svc.gamepc && svc.gamepc.offline ? ' Game PC offline since ' + svc.gamepc.offlineSince.replace('T', ' ').slice(0, 16) + ' UTC.' : '') +
    (svc.identity && svc.identity.by ? ' Signed in as ' + svc.identity.by + '.' : '');
}

// --- cc-P146: decisions and the Where chips --------------------------------------------------------------
function allItems() { return data.items.concat(data.decisions || []); }
var WHERE_CHIPS = [['questions', 'Questions'], ['outside', 'Outside the game'], ['admin', 'In game: Admin'], ['player', 'In game: Player']];
var CHAR_CHIPS = [['human', 'Human'], ['gargoyle', 'Gargoyle'], ['elf', 'Elf'], ['any', 'Any character']];
// The count on each chip is what that chip would show with the button pressed now (Mine, Open...).
function whereCount(w, c) { return allItems().filter(function (it) { return shownPrimary(it) && whereMatch(it, w, c); }).length; }
function renderWhere() {
  var out = ['<button data-w="" aria-pressed="' + (where ? 'false' : 'true') + '">Anywhere<span class="n">' + whereCount('', '') + '</span></button>'];
  WHERE_CHIPS.forEach(function (w) {
    out.push('<button data-w="' + w[0] + '" aria-pressed="' + (where === w[0] ? 'true' : 'false') + '">' + esc(w[1]) + '<span class="n">' + whereCount(w[0], '') + '</span></button>');
  });
  if (where === 'player') CHAR_CHIPS.forEach(function (c) {
    out.push('<button class="sub" data-c="' + c[0] + '" aria-pressed="' + (chr === c[0] ? 'true' : 'false') + '">' + esc(c[1]) + '<span class="n">' + whereCount('player', c[0]) + '</span></button>');
  });
  document.getElementById('where-chips').innerHTML = out.join('');
}
document.getElementById('where-chips').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  if (b.hasAttribute('data-w')) { where = b.getAttribute('data-w'); chr = ''; }
  else if (b.hasAttribute('data-c')) { chr = chr === b.getAttribute('data-c') ? '' : b.getAttribute('data-c'); }
  try { localStorage.setItem('pt-where', where); localStorage.setItem('pt-char', chr); } catch (x) {}
  render();
});
function decisionById(id) { return (data.decisions || []).filter(function (d) { return d.id === id; })[0]; }
function answerText(d) {
  var a = d.answer || {};
  var pick = a.choice === 'built' ? 'Keep what\'s built' : (a.choice || '');
  return [pick, a.text || ''].filter(Boolean).join(': ');
}
function decisionCard(d) {
  var chips = ['<span class="chip">' + esc(d.id) + '</span>', whoBadge(d)];
  var stc = d.state === 'answered' ? 'st-pass' : d.state === 'later' ? 'st-later' : '';
  chips.push('<span class="chip ' + stc + '">' + esc(d.stateLabel || d.state) + '</span>');
  if (d.split) chips.push('<span class="chip" title="The notes section is prose; this question was split out by hand (testing/decisions-overlay.json)">split by hand</span>');
  var h = '<div class="item decision ' + esc(d.state) + '" id="i-' + esc(d.id) + '"><div class="meta">' + chips.join('') + '</div>';
  h += '<div class="label">' + md(d.question) + '</div>';
  if (d.default) h += '<div class="facts"><b>Live today:</b> ' + md(d.default) + '</div>';
  if (d.recommended) h += '<div class="facts"><b>Recommended:</b> ' + md(d.recommended) + '</div>';
  var more = (d.detail ? '<div class="facts">' + md(d.detail).replace(/\n/g, '<br>') + '</div>' : '') +
    (d.link ? '<div class="facts"><a href="' + esc(d.link) + '" target="_blank" rel="noopener">The notes: ' + esc(d.notesFile || d.prompt) + (d.section ? ', ' + esc(d.section) : '') + '</a></div>' : '');
  if (more) h += '<details class="steps"><summary>More from the notes</summary>' + more + '</details>';
  var a = d.answer;
  if (a && d.state === 'answered') h += '<div class="answer">Your answer: ' + esc(answerText(d)) + ' (' + (a.by ? esc(a.by) + ', ' : '') + esc((a.at || '').slice(0, 10)) + '). You can change it until the overseer takes it.</div>';
  if (a && d.state === 'taken') h += '<div class="answer other">Answer: ' + esc(answerText(d)) + '. Taken into ' + esc(a.takenInto) + ' on ' + esc((a.takenAt || '').slice(0, 10)) + '.</div>';
  if (d.state === 'later') h += '<div class="answer other">You asked to be asked later' + (a && a.at ? ' (' + esc(a.at.slice(0, 10)) + ')' : '') + '.</div>';
  if (d.state === 'elsewhere') h += '<div class="answer other">Answered elsewhere: ' + md(d.elsewhere) + (d.source ? ' (' + md(d.source) + ')' : '') + '</div>';
  if (d.state === 'moot') h += '<div class="answer other">Moot: ' + md(d.reason) + '</div>';
  if (d.state === 'noted') h += '<div class="answer other">An older deviation, never put as a question' + (d.reason ? ': ' + md(d.reason) : '') + '. You can still answer it.</div>';
  if (d.state === 'taken' || d.state === 'moot') {
    if (d.state === 'taken') h += '<div class="actions"><button data-d="untake" data-i="' + esc(d.id) + '" title="For the overseer: put it back to answered">Not taken</button></div>';
    return h + '</div>';
  }
  var chosen = a && d.state === 'answered' ? a.choice : '';
  var opts = (d.options || []).map(function (o, i) {
    return '<button data-d="opt" data-o="' + i + '" data-i="' + esc(d.id) + '"' + (chosen === o.label ? ' class="chosen"' : '') + '>' + md(o.label) + (o.mark ? ' <small>(' + esc(o.mark) + ')</small>' : '') + '</button>';
  });
  if (d.built) opts.push('<button data-d="built" data-i="' + esc(d.id) + '"' + (chosen === 'built' ? ' class="chosen"' : '') + '>Keep what\'s built</button>');
  if (opts.length) h += '<div class="opts">' + opts.join('') + '</div>';
  h += '<textarea data-t="' + esc(d.id) + '" maxlength="2000" placeholder="Your answer in your own words (optional with a choice above)">' + esc(a && d.state === 'answered' ? a.text : '') + '</textarea>';
  h += '<div class="actions"><button class="pass" data-d="text" data-i="' + esc(d.id) + '">Save answer</button>';
  if (d.state !== 'later') h += '<button class="later" data-d="later" data-i="' + esc(d.id) + '">Ask me later</button>';
  if (d.state === 'answered') h += '<button data-d="taken" data-i="' + esc(d.id) + '" title="For the overseer: the answer is in a prompt now">Taken into P...</button>';
  return h + '</div></div>';
}
function decisionClick(b) {
  var id = b.getAttribute('data-i'), act = b.getAttribute('data-d'), d = decisionById(id);
  if (!d) return;
  var box = document.querySelector('textarea[data-t="' + id + '"]'), text = box ? box.value : '';
  var call;
  if (act === 'opt') call = api('/api/decisions/answer', { id: id, choice: d.options[parseInt(b.getAttribute('data-o'), 10)].label, text: text });
  else if (act === 'built') call = api('/api/decisions/answer', { id: id, choice: 'built', text: text });
  else if (act === 'text') {
    if (!text.trim()) { window.alert('Write an answer in the box, or press one of the choices.'); return; }
    call = api('/api/decisions/answer', { id: id, choice: d.answer && d.state === 'answered' ? d.answer.choice : '', text: text });
  }
  else if (act === 'later') call = api('/api/decisions/later', { id: id });
  else if (act === 'taken') {
    var pr = window.prompt(id + ': taken into which prompt? (for example P150)', 'P');
    if (pr === null) return;
    call = api('/api/decisions/taken', { ids: [id], prompt: pr.trim() });
  }
  else if (act === 'untake') call = api('/api/decisions/taken', { ids: [id], undo: true });
  if (!call) return;
  b.disabled = true;
  call.then(load).catch(function (x) { b.disabled = false; window.alert('Not saved: ' + x.message); });
}
document.getElementById('list').addEventListener('click', function (e) {
  if (e.target.id !== 'copy-answers') return;
  var msg = document.getElementById('answers-msg'), box = document.getElementById('answers-out');
  api('/api/decisions/copy').then(function (j) {
    if (!j.text) { msg.textContent = 'No new answers.'; return; }
    box.value = j.text; box.hidden = false; box.focus(); box.select();
    var copied = false;
    try { copied = document.execCommand('copy'); } catch (x) {}
    msg.textContent = copied ? 'Copied ' + j.ids.length + ' answer(s).' : 'Select the text below and copy it.';
  }).catch(function (x) { msg.textContent = 'Could not copy: ' + x.message; });
});

// cc-P112: the robot icons only mark items; nothing is hidden, sorted or greyed. The plan and every word of the tooltips
// come from the service (/api/bot-tonight), which reads the bot's own work check.
function botInfo(id) { return (bot && bot.available && bot.items && bot.items[id]) || {}; }
function robot(it) {
  var b = botInfo(it.id), out = [];
  if (b.state === 'tonight') out.push('<span class="robot" data-bot="tonight" title="' + esc(b.title) + '">&#129302;</span>');
  else if (b.state === 'checkable') out.push('<span class="robot dim" data-bot="checkable" title="' + esc(b.title) + '">&#129302;</span>');
  if (b.state && b.last) {
    var t = 'bot: ' + b.last.label + (b.last.at ? ' ' + b.last.at.slice(0, 10) : '');
    out.push(b.last.report ? '<a class="chip bot bot-' + esc(b.last.result) + '" href="' + esc(b.last.report) + '" target="_blank" title="The report of that run (the bot never marks Pass or Fail)">' + esc(t) + '</a>'
                           : '<span class="chip bot bot-' + esc(b.last.result) + '">' + esc(t) + '</span>');
  }
  return out.join('');
}
function botCount() {
  if (!bot) return '';
  if (!bot.available) return '<span class="count quiet" title="' + esc(bot.reason || '') + '">Bot plan unavailable</span>';
  return '<span class="count bot" data-go="bot" title="The overnight run on ' + esc(bot.short) + ' takes about ' + bot.minutes + ' min' + (bot.asOf ? '; plan as of ' + esc(bot.asOf) : '') + '">Bot tonight: ' + bot.count + '</span>';
}

// cc-P115: the Who badge, the header counts per Who, and the steps. Nothing is hidden, sorted or greyed by them.
function whoBadge(it) {
  var w = it.who;
  if (!w || !w.key) return '';
  var title = 'Who tests it: ' + w.label + (w.kind ? ' (' + w.kind + ')' : '') + (w.reason ? '. ' + w.reason : '');
  return '<span class="who who-' + esc(w.key) + '" title="' + esc(title) + '">' + esc(w.label) + '</span>';
}
function whoCounts() {
  var w = data && data.who;
  if (!w || !w.available) return '';
  var order = [['you', 'mine'], ['botyou', 'mine'], ['decide', 'mine'], ['bot', 'whobot'], ['cc', 'cc'], ['unsorted', '']], out = [];
  order.forEach(function (p) {
    var n = w.counts[p[0]] || 0, go = p[1];
    if (p[0] === 'unsorted' && !n) return;
    out.push('<span class="count who-count" data-go="' + go + '" title="Open items: ' + esc(w.labels[p[0]]) + '">' +
             '<span class="who who-' + p[0] + '">' + esc(w.labels[p[0]]) + '</span> ' + n + '</span>');
  });
  return out.join('');
}
function stepsHtml(it) {
  var s = it.steps;
  if (!s) return '';
  var rows = [];
  if (s.unknown) rows.push('<div class="step"><b>Steps unknown:</b> ' + md(s.unknown) + '</div>');
  if (s.where) rows.push('<div class="step"><b>Where:</b> ' + md(s.where) + '</div>');
  if (s.do && s.do.length) rows.push('<div class="step"><b>Do:</b><ol>' + s.do.map(function (d) { return '<li>' + md(d) + '</li>'; }).join('') + '</ol></div>');
  if (s.pass) rows.push('<div class="step"><b>Pass looks like:</b> ' + md(s.pass) + '</div>');
  if (s.check) rows.push('<div class="step"><b>Check:</b> ' + md(s.check) + '</div>');
  var head = s.where ? ': ' + md(s.where) : s.unknown ? ': steps unknown' : s.check ? ': ' + (whoKey(it) === 'cc' ? 'CC checks it' : 'the bot checks it') : '';
  return '<details class="steps"><summary>How to test' + head + '</summary>' + rows.join('') + '</details>';
}

function card(it) {
  var chips = ['<span class="chip">' + esc(it.id) + '</span>'];
  var wb = whoBadge(it);
  if (wb) chips.push(wb);
  var rb = robot(it);
  if (rb) chips.push(rb);
  if (it.version) chips.push('<span class="chip">needs ' + esc(it.version) + '</span>');
  if (it.status !== 'open') chips.push('<span class="chip st-' + esc(it.status) + '">' + esc(it.status) + (it.resultAt ? ' ' + esc(it.resultAt.slice(0, 10)) : '') + (it.by ? ' by ' + esc(it.by) : '') + '</span>');
  if (it.status === 'fail') chips.push('<span class="chip ' + (it.bug ? '' : 'warn') + '">' + (it.bug ? 'logged ' + esc(it.bug) : 'not logged yet') + '</span>');
  if (it.textChanged) chips.push('<span class="chip warn">text changed</span>');
  if (it.removedFromNotes) chips.push('<span class="chip warn">no longer in the notes</span>');
  if (it.unmarked) chips.push('<span class="chip">from For Chase, no in-game heading</span>');
  if (it.replacedBy) chips.push('<span class="chip warn">now asked as ' + it.replacedBy.length + ' question' + (it.replacedBy.length === 1 ? '' : 's') + ': ' + esc(it.replacedBy.join(', ')) + '</span>');
  var h = '<div class="item ' + esc(it.status) + '" id="i-' + esc(it.id) + '"><div class="meta">' + chips.join('') + '</div>';
  if (it.label) h += '<div class="label">' + md(it.label) + '</div>';
  h += '<div>' + md(it.what || it.text) + '</div>';
  if (it.expect) h += '<div class="expect"><b>Expect:</b> ' + md(it.expect) + '</div>';
  h += stepsHtml(it);
  if (it.note) h += '<div class="note' + (it.status === 'fail' ? '' : ' ok') + '">' + esc(it.note) + '</div>';
  if (it.textChanged && it.previousText) h += '<div class="prev">Before the notes changed: ' + md(it.previousText) + '</div>';
  h += '<div class="actions">';
  if (it.status !== 'pass') h += '<button class="pass" data-id="' + esc(it.id) + '" data-s="pass">Pass</button>';
  if (it.status !== 'fail') h += '<button class="fail" data-id="' + esc(it.id) + '" data-s="fail">Fail</button>';
  if (it.status !== 'later') h += '<button class="later" data-id="' + esc(it.id) + '" data-s="later">Later</button>';
  if (it.status !== 'open') h += '<button data-id="' + esc(it.id) + '" data-s="open">Reopen</button>';
  if (it.status === 'fail') h += '<button data-id="' + esc(it.id) + '" data-s="bug">Bug id</button>';
  h += '<button data-idea-from="' + esc(it.id) + '" title="Jot a feature idea linked to this play test">Idea from this</button>';
  h += '<button data-bug-from="' + esc(it.id) + '" title="Report a bug linked to this play test">Bug from this</button>';
  return h + '</div></div>';
}

// --- cc-P164: Up next. The sessions come from the service (tools/playsessions.py): seeded ones from
// testing/sessions.json, automatic ones for the rest, and Probably stale. Each card: the line, its Pass, Pass / Fail /
// Later; the id small underneath. Phone first.
function sessions() { return (data && data.sessions && data.sessions.list) || []; }
function sessionById(id) { return sessions().filter(function (s) { return s.id === id; })[0]; }
function sessionItem(id) { for (var i = 0, l = sessions(); i < l.length; i++) { var x = l[i].items.filter(function (y) { return y.id === id; })[0]; if (x) return [l[i], x]; } return null; }
function sessionCard(s, x) {
  var todo = !x.done;
  var h = '<div class="scard ' + (todo ? 'todo' : 'done') + '" id="s-' + esc(x.id) + '" data-item="' + esc(x.id) + '">';
  if (!todo) h += '<span class="sst ' + esc(x.status) + '">' + esc(x.status === 'pass' ? 'Passed' : x.status === 'fail' ? 'Failed' : 'Later') + '</span>';
  h += '<div class="sline"' + (todo ? '' : ' style="display:inline"') + '>' + md(x.line) + '</div>';
  if (todo) {
    if (x.pass) h += '<div class="spass"><b>Pass:</b> ' + md(x.pass) + '</div>';
    if (x.place) h += '<div class="splace">Where: ' + md(x.place) + '</div>';
    if (x.reason) h += '<div class="sreason">Probably stale: ' + esc(x.reason) + '</div>';
    (x.needs || []).forEach(function (n) { h += '<span class="tag">needs: ' + esc(n) + '</span>'; });
    h += '<div class="sact">';
    if (s.kind === 'stale') h += '<button class="later" data-ss="stale" data-sid="' + esc(x.id) + '">Later: stale</button>';
    h += '<button class="pass" data-ss="pass" data-sid="' + esc(x.id) + '">Pass</button>';
    h += '<button class="fail" data-ss="fail" data-sid="' + esc(x.id) + '">Fail</button>';
    if (s.kind !== 'stale') h += '<button class="later" data-ss="later" data-sid="' + esc(x.id) + '">Later</button>';
    h += '</div><div class="sfail" hidden><input maxlength="500" aria-label="What happened" placeholder="One line: what happened?">' +
      '<button class="fail" data-ss="failsave" data-sid="' + esc(x.id) + '">Save Fail</button></div>';
  } else {
    h += ' <button data-ss="open" data-sid="' + esc(x.id) + '" style="min-height:40px;font-size:15px">Reopen</button>';
  }
  return h + '<div class="sid">' + esc(x.id) + '</div></div>';
}
function renderNext() {
  var S = data.sessions || {}, list = sessions(), out = [];
  if (S.error) out.push('<p class="err">Sessions unavailable: ' + esc(S.error) + '. All items has everything.</p>');
  if (!sessionById(curSession)) curSession = S.upNext || (list[0] && list[0].id) || '';
  var s = sessionById(curSession), i = list.indexOf(s);
  if (!s) {
    out.push('<p class="empty">Nothing for you to test right now. All items has the full list.</p>');

  [['What happened', b.happened], ['Expected', b.expected], ['Steps', b.steps]].forEach(function (f) {
    if (f[1]) h += '<div class="desc"><b>' + f[0] + ':</b> ' + esc(f[1]) + '</div>';
  });
  if (b.character || b.location) h += '<div class="desc"><b>Where:</b> ' + esc([b.character, b.location].filter(Boolean).join(', ')) + '</div>';
  if (b.shots.length) h += '<div class="shots">' + b.shots.map(function (n) { return '<a href="/api/bugs/file/' + esc(n) + '" target="_blank" rel="noopener"><img src="/api/bugs/file/' + esc(n) + '" alt="' + esc(n) + '" loading="lazy"></a>'; }).join('') + '</div>';
  if (b.status === 'notbug') h += '<div class="note ok">Not a bug: ' + esc(b.reason) + '</div>';
  h += '<div class="actions">';
  if (!(b.status === 'taken' && b.dnum)) h += '<button class="pass" data-b="became" data-i="' + esc(b.id) + '">Became D-NN</button>';
  if (b.status !== 'taken') h += '<button data-b="taken" data-i="' + esc(b.id) + '">Taken, pending number</button>';
  if (b.status !== 'duplicate') h += '<button data-b="duplicate" data-i="' + esc(b.id) + '">Duplicate</button>';
  if (b.status !== 'notbug') h += '<button class="fail" data-b="notbug" data-i="' + esc(b.id) + '">Not a bug</button>';
  if (b.status !== 'fixed') h += '<button data-b="fixed" data-i="' + esc(b.id) + '">Fixed</button>';
  if (b.status !== 'new') h += '<button data-b="new" data-i="' + esc(b.id) + '">Back to new</button>';
  h += '<button data-b="edit" data-i="' + esc(b.id) + '">Edit</button><button data-b="delete" data-i="' + esc(b.id) + '">Delete</button>';
  return h + '</div></div>';
}
function renderBugs() {
  var list = document.getElementById('bug-list');
  if (bugsError || !bugsDoc) {
    list.innerHTML = '<p class="err">' + (bugsError ? 'Bug reports are not available: ' + esc(bugsError) + '. The service needs a restart (Start-TestQueue.ps1).' : 'Loading...') + '</p>';
    return;
  }
  var sev = document.getElementById('b-sev'), area = document.getElementById('b-area');
  if (sev.options.length === 1) bugsDoc.severities.forEach(function (a) { var o = document.createElement('option'); o.textContent = a; sev.appendChild(o); });
  if (area.options.length === 1) bugsDoc.areas.forEach(function (a) { var o = document.createElement('option'); o.textContent = a; area.appendChild(o); });
  document.getElementById('b-ver').textContent = 'Shard version: ' + (bugsDoc.version || 'unknown (the test shard has not reported one)') + '. Filled in by the server.';
  var items = bugsDoc.bugs.slice().sort(function (a, b) { return parseInt(b.id.slice(2), 10) - parseInt(a.id.slice(2), 10); });
  list.innerHTML = items.length ? items.map(bugCard).join('') : '<p class="empty">No bug reports yet. Add one above, or use "Bug from this" on a play test.</p>';
}
function renderPending() {
  document.getElementById('b-pending').innerHTML = pendingShots.map(function (d, i) {
    return '<div class="pending"><img src="' + d + '" alt="screenshot ' + (i + 1) + '"><button type="button" data-unshot="' + i + '" aria-label="Remove screenshot ' + (i + 1) + '">x</button></div>';
  }).join('');
}
function bytesOf(dataUrl) { var b64 = dataUrl.split(',')[1] || ''; return Math.floor(b64.length * 3 / 4); }
// A PNG or JPG of 2 MB or less goes as it is. Anything else (larger, or another format the browser can draw) is redrawn
// as a JPG, smaller each try, until it fits. The server checks the bytes again and refuses what is not PNG or JPG.
function prepareShot(file) {
  return new Promise(function (resolve, reject) {
    var ok = /^image\/(png|jpeg)$/.test(file.type);
    var rd = new FileReader();
    rd.onerror = function () { reject(new Error('could not read the picture')); };
    rd.onload = function () {
      var url = rd.result;
      if (ok && file.size <= MAX_SHOT) { resolve(url); return; }
      var img = new Image();
      img.onerror = function () { reject(new Error('not a picture this browser can read')); };
      img.onload = function () {
        var scale = Math.min(1, 2400 / Math.max(img.width, img.height)), out = '';
        for (var t = 0; t < 8; t++) {
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.width * scale)); c.height = Math.max(1, Math.round(img.height * scale));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL('image/jpeg', 0.85);
          if (bytesOf(out) <= MAX_SHOT) { resolve(out); return; }
          scale *= 0.75;
        }
        reject(new Error('could not make it 2 MB or smaller'));
      };
      img.src = url;
    };
    rd.readAsDataURL(file);
  });
}
function takeFiles(files, room, done) {
  var list = Array.prototype.slice.call(files || []).filter(function (f) { return /^image\//.test(f.type); });
  if (list.length > room) { window.alert('A report holds at most ' + MAX_SHOTS + ' screenshots; ' + (list.length - room) + ' left out.'); list = list.slice(0, room); }
  return Promise.all(list.map(function (f) { return prepareShot(f).catch(function (x) { window.alert('Screenshot left out: ' + x.message); return null; }); }))
    .then(function (urls) { done(urls.filter(Boolean)); });
}
function uploadShots(id, urls) {
  return urls.reduce(function (p, u) {
    return p.then(function () { return api('/api/bugs/shot', { id: id, data: u }).catch(function (x) { window.alert('Screenshot not saved: ' + x.message); }); });
  }, Promise.resolve());
}
function showBugs() {
  filter = 'bugs';
  try { localStorage.setItem('pt-filter', filter); } catch (x) {}
  render();
}
function bugFrom(pid, note) {
  showBugs();
  document.getElementById('b-pt').value = pid;
  if (note && !document.getElementById('b-happened').value) document.getElementById('b-happened').value = note;
  var form = document.getElementById('bug-form'), head = document.querySelector('header');
  window.scrollTo(0, form.getBoundingClientRect().top + window.pageYOffset - head.offsetHeight - 8);
  document.getElementById('b-title').focus({ preventScroll: true });
}
function bugCall(path, body) { return api(path, body).then(load).catch(function (x) { window.alert('Not saved: ' + x.message); }); }
document.getElementById('b-shots').addEventListener('change', function () {
  var input = this;
  takeFiles(input.files, MAX_SHOTS - pendingShots.length, function (urls) { pendingShots = pendingShots.concat(urls); input.value = ''; renderPending(); });
});
// Paste anywhere on the Bugs tab (a phone pastes into the box with a long press).
document.addEventListener('paste', function (e) {
  if (filter !== 'bugs' || !e.clipboardData) return;
  var files = [];
  Array.prototype.forEach.call(e.clipboardData.items || [], function (it) { if (it.kind === 'file' && /^image\//.test(it.type)) files.push(it.getAsFile()); });
  if (!files.length) return;
  e.preventDefault();
  takeFiles(files, MAX_SHOTS - pendingShots.length, function (urls) { pendingShots = pendingShots.concat(urls); renderPending(); });
});
document.getElementById('b-pending').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-unshot]');
  if (b) { pendingShots.splice(parseInt(b.getAttribute('data-unshot'), 10), 1); renderPending(); }
});
document.getElementById('bug-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var g = function (id) { return document.getElementById(id); };
  var body = { title: g('b-title').value, happened: g('b-happened').value, expected: g('b-expected').value, steps: g('b-steps').value,
    severity: g('b-sev').value, area: g('b-area').value, playtest: g('b-pt').value.trim(), character: g('b-char').value, location: g('b-loc').value };
  var btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true;
  api('/api/bugs/add', body).then(function (j) { return uploadShots(j.bug.id, pendingShots); })
    .then(function () {
      ['b-title', 'b-happened', 'b-expected', 'b-steps', 'b-sev', 'b-area', 'b-pt', 'b-char', 'b-loc'].forEach(function (id) { g(id).value = ''; });
      pendingShots = []; renderPending(); return load();
    })
    .catch(function (x) { window.alert('Not added: ' + x.message); })
    .then(function () { btn.disabled = false; });
});
document.getElementById('bug-list').addEventListener('click', function (e) {
  var show = e.target.closest('[data-show]');
  if (show) {
    e.preventDefault();
    filter = 'all'; render();
    var el = document.getElementById('i-' + show.getAttribute('data-show'));
    if (el) el.scrollIntoView();
    return;
  }
  var b = e.target.closest('button[data-b]');
  if (!b) return;
  var a = b.getAttribute('data-b'), id = b.getAttribute('data-i');
  if (a === 'cancel') { bugEditing = ''; renderBugs(); return; }
  if (a === 'edit') { bugEditing = id; renderBugs(); return; }
  if (a === 'delete') {
    var why = window.prompt('Delete ' + id + '? Its number is never reused. One line: why?', '');
    if (why === null) return;
    if (!why.trim()) { window.alert('Deleting a report needs a reason.'); return; }
    bugCall('/api/bugs/delete', { id: id, reason: why }); return;
  }
  var body = { id: id, status: a };
  if (a === 'became') { var d = window.prompt(id + ' became which bug-list row? (for example D91)', 'D'); if (d === null) return; body.status = 'taken'; body.dnum = d.trim(); }
  if (a === 'duplicate') { var o = window.prompt(id + ' duplicates which? A D-number (D89) or a report (B-003).', ''); if (o === null) return; body.duplicateOf = o.trim(); }
  if (a === 'notbug') {
    var r = window.prompt(id + ' is not a bug. One line: why?', ''); if (r === null) return;
    if (!r.trim()) { window.alert('"Not a bug" needs a reason.'); return; }
    body.reason = r;
  }
  if (a === 'fixed') { var cur = bugsDoc.bugs.filter(function (x) { return x.id === id; })[0]; if (cur && cur.dnum) body.dnum = cur.dnum; }
  bugCall('/api/bugs/status', body);
});
document.getElementById('bug-list').addEventListener('submit', function (e) {
  var f = e.target.closest('form[data-bedit]');
  if (!f) return;
  e.preventDefault();
  var id = f.getAttribute('data-bedit'), el = f.elements;
  var body = { id: id, title: el.title.value, happened: el.happened.value, expected: el.expected.value, steps: el.steps.value,
    severity: el.severity.value, area: el.area.value, playtest: el.playtest.value.trim(), character: el.character.value, location: el.location.value };
  var cur = bugsDoc.bugs.filter(function (x) { return x.id === id; })[0];
  var room = MAX_SHOTS - (cur ? cur.shots.length : 0), files = el.shots ? el.shots.files : [];
  api('/api/bugs/edit', body).then(function () {
    return new Promise(function (res) { takeFiles(files, room, function (urls) { res(uploadShots(id, urls)); }); });
  }).then(function () { bugEditing = ''; return load(); }).catch(function (x) { window.alert('Not saved: ' + x.message); });
});
document.getElementById('copy-bugs').addEventListener('click', function () {
  var msg = document.getElementById('bug-copy-msg'), box = document.getElementById('bug-copy-out');
  api('/api/bugs/copy').then(function (j) {
    if (!j.text) { msg.textContent = 'No new bug reports to copy.'; box.hidden = true; return; }
    box.value = j.text; box.hidden = false; box.focus(); box.select();
    var copied = false;
    try { copied = document.execCommand('copy'); } catch (x) {}
    if (!copied && navigator.clipboard) { navigator.clipboard.writeText(j.text).then(function () { msg.textContent = 'Copied.'; }, function () {}); }
    msg.textContent = copied ? 'Copied ' + j.ids.length + ' report(s).' : 'Select the text below and copy it.';
    if (window.confirm('Mark these ' + j.ids.length + ' report(s) taken by the overseer, pending a D-number?')) bugCall('/api/bugs/taken', { ids: j.ids });
  }).catch(function (x) { msg.textContent = 'Could not copy: ' + x.message; });
});

load();
// Refresh every 30 s, but never while something is being typed.
setInterval(function () { var a = document.activeElement; if ((!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) && !editing && !bugEditing && !pendingShots.length) load(); }, 30000);
</script>
</body>
</html>
