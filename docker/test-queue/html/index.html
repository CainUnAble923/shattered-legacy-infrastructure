<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Play tests</title>
<style>
:root {
  --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #66665f; --line: #deded8;
  --pass: #1d7a3a; --pass-bg: #e3f4e8; --fail: #a32020; --fail-bg: #fbe5e5;
  --later: #8a5a00; --later-bg: #fff1d6; --accent: #24508a; --chip: #ececE6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --card: #20201e; --text: #ecece6; --muted: #a3a39a; --line: #34342f;
    --pass: #7fd197; --pass-bg: #183323; --fail: #f19a9a; --fail-bg: #3a1c1c;
    --later: #f0c46c; --later-bg: #382c12; --accent: #8fb4ea; --chip: #2c2c29;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px 10px; }
.top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; }
.top a { color: var(--accent); font-weight: 600; text-decoration: none; padding: 6px 0; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.count { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-weight: 600; }
.count.fail { color: var(--fail); } .count.pass { color: var(--pass); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button, .item button, form button {
  min-height: 44px; min-width: 64px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font: inherit; font-weight: 600; cursor: pointer;
}
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
main { max-width: 900px; margin: 0 auto; padding: 8px 16px 64px; }
h2 { font-size: 17px; margin: 22px 0 8px; }
h2 small { color: var(--muted); font-weight: 400; }
.item { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; overflow-wrap: anywhere; }
.item.pass { border-left-color: var(--pass); } .item.fail { border-left-color: var(--fail); } .item.later { border-left-color: var(--later); }
.meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.chip { background: var(--chip); border-radius: 6px; padding: 1px 7px; }
.chip.warn { background: var(--later-bg); color: var(--later); }
.chip.st-pass { background: var(--pass-bg); color: var(--pass); } .chip.st-fail { background: var(--fail-bg); color: var(--fail); }
.chip.st-later { background: var(--later-bg); color: var(--later); }
/* cc-P112: the overnight bot's robot. Full: tonight's run tries it; dim: the bot can check it, no work tonight. */
.robot { font-size: 15px; line-height: 1; cursor: help; } .robot.dim { opacity: .38; filter: grayscale(1); }
.chip.bot { text-decoration: none; color: var(--text); } .chip.bot-PASS { background: var(--pass-bg); color: var(--pass); }
.chip.bot-FAIL { background: var(--fail-bg); color: var(--fail); } .chip.bot-FLAKY, .chip.bot-ERROR { background: var(--later-bg); color: var(--later); }
.count.quiet { font-weight: 400; color: var(--muted); border-style: dashed; }
.label { font-weight: 700; }
.expect { margin-top: 4px; } .expect b { color: var(--muted); font-weight: 600; }
.note { margin-top: 6px; padding: 6px 8px; border-radius: 6px; background: var(--fail-bg); color: var(--fail); }
.note.ok { background: var(--chip); color: var(--text); }
.prev { margin-top: 6px; font-size: 13px; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
button.pass { color: var(--pass); } button.fail { color: var(--fail); } button.later { color: var(--later); }
code { font: 14px ui-monospace, Consolas, monospace; background: var(--chip); border-radius: 4px; padding: 0 3px; }
form { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 12px 0; }
form input { width: 100%; min-height: 44px; margin: 4px 0 8px; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
.empty, .err { color: var(--muted); padding: 24px 0; }
.err { color: var(--fail); }
footer { color: var(--muted); font-size: 13px; margin-top: 24px; }
/* cc-P90: the Ideas tab */
.count.ideas { color: var(--accent); cursor: pointer; }
.badge { display: inline-block; min-width: 1.4em; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--bg); font-size: 13px; }
.badge[hidden] { display: none; } /* cc-P97: display above beat the hidden attribute, so a zero showed as "0" */
.filters button[aria-pressed="true"] .badge { background: var(--bg); color: var(--accent); }
form textarea, form select { width: 100%; min-height: 44px; margin: 4px 0 8px; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
form textarea { min-height: 88px; resize: vertical; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; } .row2 > div { flex: 1 1 220px; }
.hint { font-size: 14px; color: var(--later); background: var(--later-bg); border-radius: 6px; padding: 6px 8px; margin: 0 0 8px; }
.hint:empty { display: none; }
.idea { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--accent); border-radius: 8px; padding: 10px 12px; margin: 8px 0; overflow-wrap: anywhere; }
.idea.taken { border-left-color: var(--later); } .idea.became { border-left-color: var(--pass); } .idea.declined { border-left-color: var(--muted); opacity: .85; }
.idea .desc { white-space: pre-wrap; margin-top: 4px; }
.copybar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
#copy-out { width: 100%; min-height: 120px; font: 13px ui-monospace, Consolas, monospace; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.fq { margin: 2px 0; padding: 6px 8px; border-radius: 6px; } .fq:target { background: var(--later-bg); }
.fq b { font-weight: 700; } .fq small { color: var(--muted); }
/* cc-P97: the Bugs tab */
.count.bugs { color: var(--fail); cursor: pointer; }
.bug { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--fail); border-radius: 8px; padding: 10px 12px; margin: 8px 0; overflow-wrap: anywhere; }
.bug.taken { border-left-color: var(--later); } .bug.fixed { border-left-color: var(--pass); } .bug.duplicate, .bug.notbug { border-left-color: var(--muted); opacity: .85; }
.bug .desc { white-space: pre-wrap; margin-top: 2px; } .bug .desc b { color: var(--muted); font-weight: 600; }
.shots { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
.shots img { width: 96px; height: 96px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; }
.shots .pending { position: relative; } .shots .pending button { position: absolute; top: 2px; right: 2px; min-height: 32px; min-width: 32px; padding: 2px 8px; }
.paste { border: 2px dashed var(--line); border-radius: 8px; padding: 10px; margin: 4px 0 8px; color: var(--muted); font-size: 14px; }
.ver { font-size: 14px; color: var(--muted); margin: 0 0 8px; }
#bug-copy-out { width: 100%; min-height: 120px; font: 13px ui-monospace, Consolas, monospace; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
#bugs button { min-height: 44px; min-width: 64px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
#bugs input[type=file] { min-height: 44px; }
#ideas button { min-height: 44px; min-width: 64px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<!-- cc-P88: the shared menu (Play tests, Shard status, Dashboard). Until sl-play-tests is restarted with the
     /nav.js route, the old service answers 404 and the page says so in one line instead. -->
<script src="/nav.js" data-sl-page="playtests" onerror="this.insertAdjacentHTML('afterend', '<p style=&quot;margin:0;padding:8px 16px;font:14px system-ui,sans-serif&quot;>Menu not loaded: restart sl-play-tests with Start-TestQueue.ps1. <a href=&quot;/status&quot;>Shard status</a></p>')"></script>
<header>
  <div class="top">
    <h1>Play tests</h1>
    <a href="#add">Add an item</a>
  </div>
  <div class="counts" id="counts"></div>
  <div class="filters" role="group" aria-label="Show">
    <button data-f="open" aria-pressed="true">Open</button>
    <button data-f="fail" aria-pressed="false">Failed</button>
    <button data-f="all" aria-pressed="false">All</button>
    <button data-f="bot" aria-pressed="false" title="Only the items the overnight bot tries tonight">Bot tonight</button>
    <button data-f="ideas" aria-pressed="false">Ideas <span class="badge" id="ideas-n" hidden></span></button>
    <button data-f="bugs" aria-pressed="false">Bugs <span class="badge" id="bugs-n" hidden></span></button>
  </div>
</header>
<main>
  <div id="list"><p class="empty">Loading...</p></div>
  <form id="add" autocomplete="off">
    <h2>Add an item by hand</h2>
    <label for="what">What to do</label><input id="what" maxlength="500" required>
    <label for="expect">What should happen</label><input id="expect" maxlength="500">
    <button type="submit">Add</button>
  </form>
  <!-- cc-P90: the feature-ideas inbox. The features chat turns ideas into F-NN entries; this page never edits docs/. -->
  <section id="ideas" hidden>
    <form id="idea-form" autocomplete="off">
      <h2>New idea</h2>
      <label for="i-title">Idea (a short title)</label><input id="i-title" maxlength="140" required>
      <div class="hint" id="i-hint" aria-live="polite"></div>
      <div class="row2">
        <div><label for="i-area">Area</label><select id="i-area"><option value="">(none)</option></select></div>
        <div><label for="i-pt">From play test (optional)</label><input id="i-pt" maxlength="12" placeholder="P71-3"></div>
      </div>
      <label for="i-desc">Details (optional)</label><textarea id="i-desc" maxlength="2000"></textarea>
      <button type="submit">Add idea</button>
    </form>
    <div class="copybar">
      <button type="button" id="copy-new">Copy new ideas</button>
      <span id="copy-msg"></span>
    </div>
    <textarea id="copy-out" readonly hidden aria-label="New ideas as text"></textarea>
    <div id="idea-list"></div>
    <h2>Already in the feature queue <small>(docs/feature-queue.md, read only)</small></h2>
    <input id="fq-filter" placeholder="Filter by words or F-number" aria-label="Filter the feature queue">
    <div id="fq"></div>
  </section>
  <!-- cc-P97: the bug-reports inbox. The overseer gives the real ones D-numbers in docs/bug-list.md; this page never
       edits docs/. -->
  <section id="bugs" hidden>
    <form id="bug-form" autocomplete="off">
      <h2>Report a bug</h2>
      <label for="b-title">Bug (a short title)</label><input id="b-title" maxlength="140" required>
      <label for="b-happened">What happened</label><textarea id="b-happened" maxlength="2000"></textarea>
      <label for="b-expected">What you expected</label><textarea id="b-expected" maxlength="2000"></textarea>
      <label for="b-steps">Steps (optional)</label><textarea id="b-steps" maxlength="2000" placeholder="1. ...&#10;2. ..."></textarea>
      <div class="row2">
        <div><label for="b-sev">Severity</label><select id="b-sev"><option value="">(none)</option></select></div>
        <div><label for="b-area">Area</label><select id="b-area"><option value="">(none)</option></select></div>
      </div>
      <div class="row2">
        <div><label for="b-pt">From play test (optional)</label><input id="b-pt" maxlength="12" placeholder="P71-3"></div>
        <div><label for="b-char">Character (optional)</label><input id="b-char" maxlength="140"></div>
        <div><label for="b-loc">Location (optional)</label><input id="b-loc" maxlength="140" placeholder="Minoc forge, 2510 560"></div>
      </div>
      <label for="b-shots">Screenshots (up to 3, PNG or JPG)</label>
      <input id="b-shots" type="file" accept="image/png,image/jpeg,image/*" multiple>
      <div class="paste" id="b-paste" tabindex="0">Or paste a screenshot here (Ctrl+V, or long-press and Paste on a phone).</div>
      <div class="shots" id="b-pending"></div>
      <p class="ver" id="b-ver"></p>
      <button type="submit">Add bug</button>
    </form>
    <div class="copybar">
      <button type="button" id="copy-bugs">Copy new bugs</button>
      <span id="bug-copy-msg"></span>
    </div>
    <textarea id="bug-copy-out" readonly hidden aria-label="New bug reports as text"></textarea>
    <div id="bug-list"></div>
  </section>
  <footer id="foot"></footer>
</main>
<script>
// cc-P83. Items come from server.py, which imports every prompt whose notes end "Pnn DONE".
// cc-P88: the links to the other pages are the shared menu (nav.js), not this page's own.
var filter = 'open';
try { filter = localStorage.getItem('pt-filter') || 'open'; } catch (e) {}
var data = null;
var bot = null;  // cc-P112: GET /api/bot-tonight
var OPEN = { open: 1, later: 1, blocked: 1 };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
// Notes use markdown backticks and bold; show them as such, after escaping.
function md(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); }

function group(it) {
  if (it.prompt) return it.prompt;
  if (it.source === 'manual') return 'Added by hand';
  return 'Older queue (docs/client-test-queue.md)';
}
function groupRank(g) {
  var m = /^P(\d+)$/.exec(g);
  if (m) return 100000 - parseInt(m[1], 10);
  return g === 'Added by hand' ? 0 : 200000;
}
function shown(it) {
  if (filter === 'bot') return botInfo(it.id).state === 'tonight';
  if (filter === 'open') return !!OPEN[it.status];
  if (filter === 'fail') return it.status === 'fail';
  return true;
}

function render() {
  var ideasView = filter === 'ideas', bugsView = filter === 'bugs';
  document.getElementById('ideas').hidden = !ideasView;
  document.getElementById('bugs').hidden = !bugsView;
  document.getElementById('list').hidden = ideasView || bugsView;
  document.getElementById('add').hidden = ideasView || bugsView;
  Array.prototype.forEach.call(document.querySelectorAll('.filters button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-f') === filter ? 'true' : 'false'); });
  renderIdeaCount();
  if (ideasView) renderIdeas();
  if (bugsView) renderBugs();
  if (!data) return;  // a filter clicked before the first load: load() renders when it arrives
  var s = data.summary;
  document.getElementById('counts').innerHTML =
    '<span class="count">' + s.open + ' open</span>' +
    '<span class="count fail">' + s.failed + ' failed' + (s.unloggedFails ? ' (' + s.unloggedFails + ' not logged)' : '') + '</span>' +
    '<span class="count pass">' + s.passed + ' passed</span>' +
    (s.later ? '<span class="count">' + s.later + ' later</span>' : '') +
    (ideas && ideas.summary.new ? '<span class="count ideas" data-go="ideas">' + ideas.summary.new + ' new idea' + (ideas.summary.new === 1 ? '' : 's') + '</span>' : '') +
    (bugsDoc && bugsDoc.summary.new ? '<span class="count bugs" data-go="bugs">' + bugsDoc.summary.new + ' new bug' + (bugsDoc.summary.new === 1 ? '' : 's') + '</span>' : '') +
    botCount();
  Array.prototype.forEach.call(document.querySelectorAll('.filters button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-f') === filter ? 'true' : 'false'); });
  var groups = {};
  data.items.forEach(function (it) { if (shown(it)) { (groups[group(it)] = groups[group(it)] || []).push(it); } });
  var names = Object.keys(groups).sort(function (a, b) { return groupRank(a) - groupRank(b); });
  var out = [];
  names.forEach(function (g) {
    var p = data.prompts[g];
    var title = p && p.title ? ' <small>' + esc(p.title.replace(/^cc-P\S*:?\s*/, '')) + '</small>' : '';
    out.push('<h2>' + esc(g) + title + '</h2>');
    groups[g].forEach(function (it) { out.push(card(it)); });
  });
  document.getElementById('list').innerHTML = out.length ? out.join('') : '<p class="empty">Nothing here.' + (filter === 'open' ? ' Every item has a result.' : '') + '</p>';
  var svc = data.service || {};
  document.getElementById('foot').textContent = 'Data: testing/play-tests.json in shard-migration. Last import ' + (svc.lastImport || 'not yet') +
    (svc.lastImportError ? ', FAILED: ' + svc.lastImportError : '') + '. A prompt that says DONE appears within a minute.' +
    // cc-P105: on Haven, how fresh the notes are and whether the game PC is reporting. Empty on the game PC: no change.
    (svc.repo && svc.repo.at ? ' Repo as of ' + svc.repo.at.replace('T', ' ').slice(0, 16) + (svc.repo.commit ? ' (' + svc.repo.commit.slice(0, 7) + ')' : '') + '.' : '') +
    (svc.gamepc && svc.gamepc.offline ? ' Game PC offline since ' + svc.gamepc.offlineSince.replace('T', ' ').slice(0, 16) + ' UTC.' : '') +
    (svc.identity && svc.identity.by ? ' Signed in as ' + svc.identity.by + '.' : '');
}

// cc-P112: the robot icons only mark items; nothing is hidden, sorted or greyed. The plan and every word of the tooltips
// come from the service (/api/bot-tonight), which reads the bot's own work check.
function botInfo(id) { return (bot && bot.available && bot.items && bot.items[id]) || {}; }
function robot(it) {
  var b = botInfo(it.id), out = [];
  if (b.state === 'tonight') out.push('<span class="robot" data-bot="tonight" title="' + esc(b.title) + '">&#129302;</span>');
  else if (b.state === 'checkable') out.push('<span class="robot dim" data-bot="checkable" title="' + esc(b.title) + '">&#129302;</span>');
  if (b.state && b.last) {
    var t = 'bot: ' + b.last.label + (b.last.at ? ' ' + b.last.at.slice(0, 10) : '');
    out.push(b.last.report ? '<a class="chip bot bot-' + esc(b.last.result) + '" href="' + esc(b.last.report) + '" target="_blank" title="The report of that run (the bot never marks Pass or Fail)">' + esc(t) + '</a>'
                           : '<span class="chip bot bot-' + esc(b.last.result) + '">' + esc(t) + '</span>');
  }
  return out.join('');
}
function botCount() {
  if (!bot) return '';
  if (!bot.available) return '<span class="count quiet" title="' + esc(bot.reason || '') + '">Bot plan unavailable</span>';
  return '<span class="count bot" data-go="bot" title="The overnight run on ' + esc(bot.short) + ' takes about ' + bot.minutes + ' min' + (bot.asOf ? '; plan as of ' + esc(bot.asOf) : '') + '">Bot tonight: ' + bot.count + '</span>';
}

function card(it) {
  var chips = ['<span class="chip">' + esc(it.id) + '</span>'];
  var rb = robot(it);
  if (rb) chips.push(rb);
  if (it.version) chips.push('<span class="chip">needs ' + esc(it.version) + '</span>');
  if (it.status !== 'open') chips.push('<span class="chip st-' + esc(it.status) + '">' + esc(it.status) + (it.resultAt ? ' ' + esc(it.resultAt.slice(0, 10)) : '') + (it.by ? ' by ' + esc(it.by) : '') + '</span>');
  if (it.status === 'fail') chips.push('<span class="chip ' + (it.bug ? '' : 'warn') + '">' + (it.bug ? 'logged ' + esc(it.bug) : 'not logged yet') + '</span>');
  if (it.textChanged) chips.push('<span class="chip warn">text changed</span>');
  if (it.removedFromNotes) chips.push('<span class="chip warn">no longer in the notes</span>');
  if (it.unmarked) chips.push('<span class="chip">from For Chase, no in-game heading</span>');
  var h = '<div class="item ' + esc(it.status) + '" id="i-' + esc(it.id) + '"><div class="meta">' + chips.join('') + '</div>';
  if (it.label) h += '<div class="label">' + md(it.label) + '</div>';
  h += '<div>' + md(it.what || it.text) + '</div>';
  if (it.expect) h += '<div class="expect"><b>Expect:</b> ' + md(it.expect) + '</div>';
  if (it.note) h += '<div class="note' + (it.status === 'fail' ? '' : ' ok') + '">' + esc(it.note) + '</div>';
  if (it.textChanged && it.previousText) h += '<div class="prev">Before the notes changed: ' + md(it.previousText) + '</div>';
  h += '<div class="actions">';
  if (it.status !== 'pass') h += '<button class="pass" data-id="' + esc(it.id) + '" data-s="pass">Pass</button>';
  if (it.status !== 'fail') h += '<button class="fail" data-id="' + esc(it.id) + '" data-s="fail">Fail</button>';
  if (it.status !== 'later') h += '<button class="later" data-id="' + esc(it.id) + '" data-s="later">Later</button>';
  if (it.status !== 'open') h += '<button data-id="' + esc(it.id) + '" data-s="open">Reopen</button>';
  if (it.status === 'fail') h += '<button data-id="' + esc(it.id) + '" data-s="bug">Bug id</button>';
  h += '<button data-idea-from="' + esc(it.id) + '" title="Jot a feature idea linked to this play test">Idea from this</button>';
  h += '<button data-bug-from="' + esc(it.id) + '" title="Report a bug linked to this play test">Bug from this</button>';
  return h + '</div></div>';
}

function api(path, body) {
  return fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {})
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); });
}
function load() {
  var a = api('/api/items').then(function (j) { data = j; })
    .catch(function (e) { document.getElementById('list').innerHTML = '<p class="err">Could not load: ' + esc(e.message) + '</p>'; });
  // cc-P90: the ideas load beside the items; an older service without /api/ideas says so on the Ideas tab only.
  var b = api('/api/ideas').then(function (j) { ideas = j; ideasError = ''; })
    .catch(function (e) { ideasError = e.message; });
  // cc-P97: and the bug reports, the same way.
  var c = api('/api/bugs').then(function (j) { bugsDoc = j; bugsError = ''; })
    .catch(function (e) { bugsError = e.message; });

  var form = document.getElementById('bug-form'), head = document.querySelector('header');
  window.scrollTo(0, form.getBoundingClientRect().top + window.pageYOffset - head.offsetHeight - 8);
  document.getElementById('b-title').focus({ preventScroll: true });
}
function bugCall(path, body) { return api(path, body).then(load).catch(function (x) { window.alert('Not saved: ' + x.message); }); }
document.getElementById('b-shots').addEventListener('change', function () {
  var input = this;
  takeFiles(input.files, MAX_SHOTS - pendingShots.length, function (urls) { pendingShots = pendingShots.concat(urls); input.value = ''; renderPending(); });
});
// Paste anywhere on the Bugs tab (a phone pastes into the box with a long press).
document.addEventListener('paste', function (e) {
  if (filter !== 'bugs' || !e.clipboardData) return;
  var files = [];
  Array.prototype.forEach.call(e.clipboardData.items || [], function (it) { if (it.kind === 'file' && /^image\//.test(it.type)) files.push(it.getAsFile()); });
  if (!files.length) return;
  e.preventDefault();
  takeFiles(files, MAX_SHOTS - pendingShots.length, function (urls) { pendingShots = pendingShots.concat(urls); renderPending(); });
});
document.getElementById('b-pending').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-unshot]');
  if (b) { pendingShots.splice(parseInt(b.getAttribute('data-unshot'), 10), 1); renderPending(); }
});
document.getElementById('bug-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var g = function (id) { return document.getElementById(id); };
  var body = { title: g('b-title').value, happened: g('b-happened').value, expected: g('b-expected').value, steps: g('b-steps').value,
    severity: g('b-sev').value, area: g('b-area').value, playtest: g('b-pt').value.trim(), character: g('b-char').value, location: g('b-loc').value };
  var btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true;
  api('/api/bugs/add', body).then(function (j) { return uploadShots(j.bug.id, pendingShots); })
    .then(function () {
      ['b-title', 'b-happened', 'b-expected', 'b-steps', 'b-sev', 'b-area', 'b-pt', 'b-char', 'b-loc'].forEach(function (id) { g(id).value = ''; });
      pendingShots = []; renderPending(); return load();
    })
    .catch(function (x) { window.alert('Not added: ' + x.message); })
    .then(function () { btn.disabled = false; });
});
document.getElementById('bug-list').addEventListener('click', function (e) {
  var show = e.target.closest('[data-show]');
  if (show) {
    e.preventDefault();
    filter = 'all'; render();
    var el = document.getElementById('i-' + show.getAttribute('data-show'));
    if (el) el.scrollIntoView();
    return;
  }
  var b = e.target.closest('button[data-b]');
  if (!b) return;
  var a = b.getAttribute('data-b'), id = b.getAttribute('data-i');
  if (a === 'cancel') { bugEditing = ''; renderBugs(); return; }
  if (a === 'edit') { bugEditing = id; renderBugs(); return; }
  if (a === 'delete') {
    var why = window.prompt('Delete ' + id + '? Its number is never reused. One line: why?', '');
    if (why === null) return;
    if (!why.trim()) { window.alert('Deleting a report needs a reason.'); return; }
    bugCall('/api/bugs/delete', { id: id, reason: why }); return;
  }
  var body = { id: id, status: a };
  if (a === 'became') { var d = window.prompt(id + ' became which bug-list row? (for example D91)', 'D'); if (d === null) return; body.status = 'taken'; body.dnum = d.trim(); }
  if (a === 'duplicate') { var o = window.prompt(id + ' duplicates which? A D-number (D89) or a report (B-003).', ''); if (o === null) return; body.duplicateOf = o.trim(); }
  if (a === 'notbug') {
    var r = window.prompt(id + ' is not a bug. One line: why?', ''); if (r === null) return;
    if (!r.trim()) { window.alert('"Not a bug" needs a reason.'); return; }
    body.reason = r;
  }
  if (a === 'fixed') { var cur = bugsDoc.bugs.filter(function (x) { return x.id === id; })[0]; if (cur && cur.dnum) body.dnum = cur.dnum; }
  bugCall('/api/bugs/status', body);
});
document.getElementById('bug-list').addEventListener('submit', function (e) {
  var f = e.target.closest('form[data-bedit]');
  if (!f) return;
  e.preventDefault();
  var id = f.getAttribute('data-bedit'), el = f.elements;
  var body = { id: id, title: el.title.value, happened: el.happened.value, expected: el.expected.value, steps: el.steps.value,
    severity: el.severity.value, area: el.area.value, playtest: el.playtest.value.trim(), character: el.character.value, location: el.location.value };
  var cur = bugsDoc.bugs.filter(function (x) { return x.id === id; })[0];
  var room = MAX_SHOTS - (cur ? cur.shots.length : 0), files = el.shots ? el.shots.files : [];
  api('/api/bugs/edit', body).then(function () {
    return new Promise(function (res) { takeFiles(files, room, function (urls) { res(uploadShots(id, urls)); }); });
  }).then(function () { bugEditing = ''; return load(); }).catch(function (x) { window.alert('Not saved: ' + x.message); });
});
document.getElementById('copy-bugs').addEventListener('click', function () {
  var msg = document.getElementById('bug-copy-msg'), box = document.getElementById('bug-copy-out');
  api('/api/bugs/copy').then(function (j) {
    if (!j.text) { msg.textContent = 'No new bug reports to copy.'; box.hidden = true; return; }
    box.value = j.text; box.hidden = false; box.focus(); box.select();
    var copied = false;
    try { copied = document.execCommand('copy'); } catch (x) {}
    if (!copied && navigator.clipboard) { navigator.clipboard.writeText(j.text).then(function () { msg.textContent = 'Copied.'; }, function () {}); }
    msg.textContent = copied ? 'Copied ' + j.ids.length + ' report(s).' : 'Select the text below and copy it.';
    if (window.confirm('Mark these ' + j.ids.length + ' report(s) taken by the overseer, pending a D-number?')) bugCall('/api/bugs/taken', { ids: j.ids });
  }).catch(function (x) { msg.textContent = 'Could not copy: ' + x.message; });
});

load();
// Refresh every 30 s, but never while something is being typed.
setInterval(function () { var a = document.activeElement; if ((!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) && !editing && !bugEditing && !pendingShots.length) load(); }, 30000);
</script>
</body>
</html>
