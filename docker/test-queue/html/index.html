<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Play tests</title>
<style>
:root {
  --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #66665f; --line: #deded8;
  --pass: #1d7a3a; --pass-bg: #e3f4e8; --fail: #a32020; --fail-bg: #fbe5e5;
  --later: #8a5a00; --later-bg: #fff1d6; --accent: #24508a; --chip: #ececE6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --card: #20201e; --text: #ecece6; --muted: #a3a39a; --line: #34342f;
    --pass: #7fd197; --pass-bg: #183323; --fail: #f19a9a; --fail-bg: #3a1c1c;
    --later: #f0c46c; --later-bg: #382c12; --accent: #8fb4ea; --chip: #2c2c29;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px 10px; }
.top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; }
.top a { color: var(--accent); font-weight: 600; text-decoration: none; padding: 6px 0; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.count { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-weight: 600; }
.count.fail { color: var(--fail); } .count.pass { color: var(--pass); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button, .item button, form button {
  min-height: 44px; min-width: 64px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font: inherit; font-weight: 600; cursor: pointer;
}
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
main { max-width: 900px; margin: 0 auto; padding: 8px 16px 64px; }
h2 { font-size: 17px; margin: 22px 0 8px; }
h2 small { color: var(--muted); font-weight: 400; }
.item { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; overflow-wrap: anywhere; }
.item.pass { border-left-color: var(--pass); } .item.fail { border-left-color: var(--fail); } .item.later { border-left-color: var(--later); }
.meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.chip { background: var(--chip); border-radius: 6px; padding: 1px 7px; }
.chip.warn { background: var(--later-bg); color: var(--later); }
.chip.st-pass { background: var(--pass-bg); color: var(--pass); } .chip.st-fail { background: var(--fail-bg); color: var(--fail); }
.chip.st-later { background: var(--later-bg); color: var(--later); }
.label { font-weight: 700; }
.expect { margin-top: 4px; } .expect b { color: var(--muted); font-weight: 600; }
.note { margin-top: 6px; padding: 6px 8px; border-radius: 6px; background: var(--fail-bg); color: var(--fail); }
.note.ok { background: var(--chip); color: var(--text); }
.prev { margin-top: 6px; font-size: 13px; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
button.pass { color: var(--pass); } button.fail { color: var(--fail); } button.later { color: var(--later); }
code { font: 14px ui-monospace, Consolas, monospace; background: var(--chip); border-radius: 4px; padding: 0 3px; }
form { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 12px 0; }
form input { width: 100%; min-height: 44px; margin: 4px 0 8px; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
.empty, .err { color: var(--muted); padding: 24px 0; }
.err { color: var(--fail); }
footer { color: var(--muted); font-size: 13px; margin-top: 24px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Play tests</h1>
    <a id="dash" href="#">Dashboard</a>
    <a href="#add">Add an item</a>
  </div>
  <div class="counts" id="counts"></div>
  <div class="filters" role="group" aria-label="Show">
    <button data-f="open" aria-pressed="true">Open</button>
    <button data-f="fail" aria-pressed="false">Failed</button>
    <button data-f="all" aria-pressed="false">All</button>
  </div>
</header>
<main>
  <div id="list"><p class="empty">Loading...</p></div>
  <form id="add" autocomplete="off">
    <h2>Add an item by hand</h2>
    <label for="what">What to do</label><input id="what" maxlength="500" required>
    <label for="expect">What should happen</label><input id="expect" maxlength="500">
    <button type="submit">Add</button>
  </form>
  <footer id="foot"></footer>
</main>
<script>
// cc-P83. Items come from server.py, which imports every prompt whose notes end "Pnn DONE".
// The Dashboard link is built from the host this page was reached at, so it works from a phone on the LAN.
var host = window.location.hostname;
document.getElementById('dash').href = window.location.protocol + '//' + host + ':3000/';
var filter = 'open';
try { filter = localStorage.getItem('pt-filter') || 'open'; } catch (e) {}
var data = null;
var OPEN = { open: 1, later: 1, blocked: 1 };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
// Notes use markdown backticks and bold; show them as such, after escaping.
function md(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); }

function group(it) {
  if (it.prompt) return it.prompt;
  if (it.source === 'manual') return 'Added by hand';
  return 'Older queue (docs/client-test-queue.md)';
}
function groupRank(g) {
  var m = /^P(\d+)$/.exec(g);
  if (m) return 100000 - parseInt(m[1], 10);
  return g === 'Added by hand' ? 0 : 200000;
}
function shown(it) {
  if (filter === 'open') return !!OPEN[it.status];
  if (filter === 'fail') return it.status === 'fail';
  return true;
}

function render() {
  if (!data) return;  // a filter clicked before the first load: load() renders when it arrives
  var s = data.summary;
  document.getElementById('counts').innerHTML =
    '<span class="count">' + s.open + ' open</span>' +
    '<span class="count fail">' + s.failed + ' failed' + (s.unloggedFails ? ' (' + s.unloggedFails + ' not logged)' : '') + '</span>' +
    '<span class="count pass">' + s.passed + ' passed</span>' +
    (s.later ? '<span class="count">' + s.later + ' later</span>' : '');
  Array.prototype.forEach.call(document.querySelectorAll('.filters button'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-f') === filter ? 'true' : 'false'); });
  var groups = {};
  data.items.forEach(function (it) { if (shown(it)) { (groups[group(it)] = groups[group(it)] || []).push(it); } });
  var names = Object.keys(groups).sort(function (a, b) { return groupRank(a) - groupRank(b); });
  var out = [];
  names.forEach(function (g) {
    var p = data.prompts[g];
    var title = p && p.title ? ' <small>' + esc(p.title.replace(/^cc-P\S*:?\s*/, '')) + '</small>' : '';
    out.push('<h2>' + esc(g) + title + '</h2>');
    groups[g].forEach(function (it) { out.push(card(it)); });
  });
  document.getElementById('list').innerHTML = out.length ? out.join('') : '<p class="empty">Nothing here.' + (filter === 'open' ? ' Every item has a result.' : '') + '</p>';
  var svc = data.service || {};
  document.getElementById('foot').textContent = 'Data: testing/play-tests.json in shard-migration. Last import ' + (svc.lastImport || 'not yet') +
    (svc.lastImportError ? ', FAILED: ' + svc.lastImportError : '') + '. A prompt that says DONE appears within a minute.';
}

function card(it) {
  var chips = ['<span class="chip">' + esc(it.id) + '</span>'];
  if (it.version) chips.push('<span class="chip">needs ' + esc(it.version) + '</span>');
  if (it.status !== 'open') chips.push('<span class="chip st-' + esc(it.status) + '">' + esc(it.status) + (it.resultAt ? ' ' + esc(it.resultAt.slice(0, 10)) : '') + '</span>');
  if (it.status === 'fail') chips.push('<span class="chip ' + (it.bug ? '' : 'warn') + '">' + (it.bug ? 'logged ' + esc(it.bug) : 'not logged yet') + '</span>');
  if (it.textChanged) chips.push('<span class="chip warn">text changed</span>');
  if (it.removedFromNotes) chips.push('<span class="chip warn">no longer in the notes</span>');
  if (it.unmarked) chips.push('<span class="chip">from For Chase, no in-game heading</span>');
  var h = '<div class="item ' + esc(it.status) + '" id="i-' + esc(it.id) + '"><div class="meta">' + chips.join('') + '</div>';
  if (it.label) h += '<div class="label">' + md(it.label) + '</div>';
  h += '<div>' + md(it.what || it.text) + '</div>';
  if (it.expect) h += '<div class="expect"><b>Expect:</b> ' + md(it.expect) + '</div>';
  if (it.note) h += '<div class="note' + (it.status === 'fail' ? '' : ' ok') + '">' + esc(it.note) + '</div>';
  if (it.textChanged && it.previousText) h += '<div class="prev">Before the notes changed: ' + md(it.previousText) + '</div>';
  h += '<div class="actions">';
  if (it.status !== 'pass') h += '<button class="pass" data-id="' + esc(it.id) + '" data-s="pass">Pass</button>';
  if (it.status !== 'fail') h += '<button class="fail" data-id="' + esc(it.id) + '" data-s="fail">Fail</button>';
  if (it.status !== 'later') h += '<button class="later" data-id="' + esc(it.id) + '" data-s="later">Later</button>';
  if (it.status !== 'open') h += '<button data-id="' + esc(it.id) + '" data-s="open">Reopen</button>';
  if (it.status === 'fail') h += '<button data-id="' + esc(it.id) + '" data-s="bug">Bug id</button>';
  return h + '</div></div>';
}

function api(path, body) {
  return fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {})
    .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); });
}
function load() {
  return api('/api/items').then(function (j) { data = j; render(); })
    .catch(function (e) { document.getElementById('list').innerHTML = '<p class="err">Could not load: ' + esc(e.message) + '</p>'; });
}

document.querySelector('.filters').addEventListener('click', function (e) {
  var f = e.target.getAttribute('data-f');
  if (!f) return;
  filter = f;
  try { localStorage.setItem('pt-filter', f); } catch (x) {}
  render();
});
document.getElementById('list').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-id]');
  if (!b) return;
  var id = b.getAttribute('data-id'), s = b.getAttribute('data-s');
  var call;
  if (s === 'bug') {
    var bug = window.prompt(id + ': the bug-list id this Fail was logged as (for example D86). Empty clears it.', '');
    if (bug === null) return;
    call = api('/api/bug', { id: id, bug: bug });
  } else {
    var note = '';
    if (s === 'fail') {
      note = window.prompt(id + ' failed. One line: what happened?', '');
      if (note === null) return;
      if (!note.trim()) { window.alert('A Fail needs a note.'); return; }
    }
    call = api('/api/result', { id: id, status: s, note: note });
  }
  b.disabled = true;
  call.then(load).catch(function (x) { b.disabled = false; window.alert('Not saved: ' + x.message); });
});
document.getElementById('add').addEventListener('submit', function (e) {
  e.preventDefault();
  var w = document.getElementById('what'), x = document.getElementById('expect');
  api('/api/manual', { what: w.value, expect: x.value }).then(function () { w.value = ''; x.value = ''; return load(); })
    .catch(function (err) { window.alert('Not added: ' + err.message); });
});
load();
// Refresh every 30 s, but never while something is being typed.
setInterval(function () { var a = document.activeElement; if (!a || a.tagName !== 'INPUT') load(); }, 30000);
</script>
</body>
</html>
