server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    location = / { try_files /index.html =404; add_header Cache-Control "no-cache" always; }

    # The one file served from the docs folder. Never cached: the page polls it.
    location = /client-test-queue.md {
        alias /docs/client-test-queue.md;
        default_type "text/markdown; charset=utf-8";
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location / { return 404; }
}
