server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location / {
        try_files $uri $uri/ =404;
    }

    # Prevent hotlinking non-download assets
    location ~* \.(html|php)$ {
        deny all;
    }
}
