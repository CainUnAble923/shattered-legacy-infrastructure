services:
  dashboard:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: sl-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"   # LAN access via http://192.168.1.58:3000
    volumes:
      - ./config:/app/config
      - ./config/icons:/app/public/icons
      - /var/run/docker.sock:/var/run/docker.sock:ro   # for Docker widget
    environment:
      TZ: ${TZ:-America/Chicago}
      HOMEPAGE_ALLOWED_HOSTS: "dashboard.shatteredlegacyuo.com,localhost,192.168.1.58,192.168.1.58:3000,localhost:3000"

networks:
  default:
    name: sl-dashboard-net

volumes: {}
