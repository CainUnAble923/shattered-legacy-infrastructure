# Two machines, and the dashboard must not blur them (bug-list D30):
#   192.168.1.58  the Windows box: the UO shard, the Minecraft stack, this dashboard
#   192.168.1.61  Haven: the whole web stack, and the proxy that actually serves the domain
# A ping at the wrong address is a green light that means nothing.

- Shattered Legacy:
    - UO Server:
        icon: /icons/shattered_legacy_logo.png
        href: "http://shatteredlegacyuo.com:2593"
        description: ModernUO, port 2593
        server: my-docker
        container: sl-modernuo
        showStats: true
        ping: 192.168.1.58

    - UO Who's Online:
        icon: /icons/shattered_legacy_logo.png
        href: "https://shatteredlegacyuo.com"
        description: Characters in world right now
        widget:
          type: customapi
          url: http://192.168.1.58:8092/status.json
          refreshInterval: 30000
          mappings:
            - field:
                players: count
              label: Online
            - field:
                shard: uptimeSeconds
              label: Uptime
              format: duration

    - Website:
        icon: nginx
        href: "https://shatteredlegacyuo.com"
        description: Landing page and download
        ping: 192.168.1.61

    - Migration status:
        icon: /icons/shattered_legacy_logo.png
        href: "https://shatteredlegacyuo.com/migration.html"
        description: Defects and content reach
        widget:
          type: customapi
          url: http://192.168.1.58:8092/migration.json
          refreshInterval: 300000
          mappings:
            - field:
                defects: open
              label: Open
            - field:
                content: reachableFiles
              label: In reach

    - Wiki:
        icon: /icons/shattered_legacy_logo.png
        href: "https://wiki.shatteredlegacyuo.com"
        description: DokuWiki
        ping: 192.168.1.61

    - Downloads:
        icon: nginx
        href: "https://get.shatteredlegacyuo.com"
        description: Client files and patches
        ping: 192.168.1.61

- Family Game Servers:
    - ATM10 Minecraft:
        icon: minecraft
        href: "http://atm10.shatteredlegacyuo.com:25565"
        description: All the Mods 10 — family LAN server
        server: my-docker
        container: atm10
        showStats: true
        ping: 192.168.1.58
        widget:
          type: minecraft
          url: udp://atm10.shatteredlegacyuo.com:25565

    - ATM10 Who's Online:
        icon: minecraft
        href: "http://atm10.shatteredlegacyuo.com:25565"
        description: Current players
        widget:
          type: customapi
          url: http://192.168.1.58:8091/
          refreshInterval: 15000
          mappings:
            - field: onlineText
              label: Online
            - field: playersText
              label: Players

    - ATM10 Live Map:
        icon: minecraft
        href: "http://atm10.shatteredlegacyuo.com:8100"
        description: BlueMap — live world map
        ping: 192.168.1.58

    - ATM10 Quest Progress:
        icon: minecraft
        href: "http://atm10.shatteredlegacyuo.com:25565"
        description: FTB Quests completion (shared team progress)
        widget:
          type: customapi
          url: http://192.168.1.58:8091/quests/summary
          refreshInterval: 60000
          mappings:
            - field: summaryLabel
              label: Completed

    - ATM10 Recent Quests:
        icon: minecraft
        href: "http://atm10.shatteredlegacyuo.com:25565"
        description: Latest quests completed and by who
        widget:
          type: customapi
          url: http://192.168.1.58:8091/quests/recent
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: data
            name: player
            label: quest
            format: text

    - ATM10 Achievement Leaderboard:
        icon: minecraft
        href: "http://atm10.shatteredlegacyuo.com:25565"
        description: Advancements unlocked by player
        widget:
          type: customapi
          url: http://192.168.1.58:8091/leaderboard/achievements
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: data
            name: name
            label: achievementsLabel
            format: text

    - ATM10 Uptime:
        icon: minecraft
        href: "http://atm10.shatteredlegacyuo.com:25565"
        description: How long the server has been running
        widget:
          type: customapi
          url: http://192.168.1.58:8091/
          refreshInterval: 15000
          mappings:
            - field: uptimeSeconds
              label: Uptime
              format: duration

- Infrastructure:
    # There are TWO Nginx Proxy Manager instances and only one of them serves the domain.
    # That is bug-list D30, and naming them apart here is half the cure.
    - Proxy (Haven):
        icon: nginx-proxy-manager
        href: "https://shatteredlegacyuo.com"
        description: The real one. Fronts website, wiki, downloads, vault
        siteMonitor: "http://192.168.1.61:80"

    - Proxy (Windows box, stray):
        icon: nginx-proxy-manager
        href: "http://127.0.0.1:81"
        description: Serves nothing public. Candidate for removal (D30)
        siteMonitor: "http://192.168.1.58:80"

    - Password vault:
        icon: bitwarden
        href: "https://vault.shatteredlegacyuo.com"
        description: Vaultwarden, on Haven
        ping: 192.168.1.61

    - Status feed:
        icon: nginx
        href: "http://192.168.1.58:8092/status.json"
        description: What the website reads. LAN only
        siteMonitor: "http://192.168.1.58:8092/status.json"
