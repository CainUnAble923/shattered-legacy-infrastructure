- Sunflower:
    - "Print queue":
        icon: "mdi-printer-3d"
        href: "http://haven.tail81098d.ts.net:8787/"
        description: "Opener orders and the public lead-time page. On Haven after Print queue: deploy [Haven]"
        server: "haven"
        container: "sunflower-print-queue"
        siteMonitor: "http://192.168.1.61:8787/api/push"
        widget:
          type: "customapi"
          url: "http://192.168.1.61:8787/api/summary"
          refreshInterval: 60000
          mappings:
            - field: "active"
              label: "Orders"
              format: "number"
            - field: "printing"
              label: "Printing"
              format: "number"
            - field: "backlogPlates"
              label: "Plates to print"
              format: "number"
            - field: "pushOk"
              label: "Lead-time page"
              remap:
                - value: true
                  to: "Updated"
                - value: false
                  to: "Push failing"
                - any: true
                  to: "Not pushed yet"
    - "Print queue (tower copy)":
        icon: "mdi-printer-3d-off"
        href: "http://localhost:8787/"
        description: "Still on the game PC until Print queue: deploy; then it should read Down for good [Game PC]"
        widget:
          type: "customapi"
          url: "http://192.168.1.61:8094/api/gamepc"
          refreshInterval: 60000
          headers:
            Authorization: "Bearer {{HOMEPAGE_VAR_OPS_TOKEN}}"
          mappings:
            - field: "up.print-queue-tower"
              label: "State"
              remap:
                - value: null
                  to: "Not reported yet"
            - field: "receivedAt"
              label: "As of"
              format: "relativeDate"
    - "Live store":
        icon: "mdi-storefront"
        href: "https://sunflowercustomgiftshop.com"
        description: "Sunflower Custom Gifts (Hostinger) [Hostinger]"
        siteMonitor: "https://sunflowercustomgiftshop.com"
