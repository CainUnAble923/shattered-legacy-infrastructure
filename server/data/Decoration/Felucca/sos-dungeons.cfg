# Siege of Sosaria: the author's dungeon decoration. Author: Zigholtul, Siege of Sosaria Trammel Map 3.0
# (SOS Trammel Dungeons.cfg, used with credit). Ported for Shattered Legacy by cc-P683 (SoS swap S6), from P694.
# This copy is Felucca's: load it on Felucca only; every MapDest is Felucca. Types: ServUO's
# Server.Items.Teleporter = pinned's Server.Items.Teleporter (item 0x1BC3); no type without a match.
# 130 placements ship. Sealed until S18 spawns the dungeon (Chase 10-27), their surface entrances
# commented out with "# S6 SEALED: " (70 placements). Made by shard-migration notes/cc-P683-tools/port.py;
# to open a dungeon, add it to OPENED there and run it again. The sealed dungeons:
#  Agurast Ascension, Amul Seketsi Royal Tomb, Azurite Caverns, Bharlim Passage, Black Widow Pit, Bleak Wind Tunnels
#  Dragons Den, Everstar Estuary, Fortress Calcifina, Fungully Grotto, Ghuul Sanctuary, Hammerhill Sewers
#  Iguana Cove, Mongbat Hideout, Murkmere Dwelling, Nimaku Lava Basin, Oboru Burial Grounds, Passage of Lost Souls
#  Seaspray Solitude, Sentinels Military Base, Skulker's Den, Stone Burrow Mines, Swampwater Solitude
#  Whispering Hollow, Wylarn Caverns
# The last MISC header places nothing in the author's file and is kept as a comment ("# S6 UNPLACED: ").

